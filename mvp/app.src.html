function agentInstructions() {
  const today = todayIso();
  const data = {
    proyectos: S.projects.map((p) => ({
      code: p.code, client: p.client, name: p.name, startDate: p.startDate, endDate: p.endDate, budgetEUR: p.budget,
      status: p.status === 'closed' ? 'cerrado' : 'activo',
      participants: (p.participants || []).map((x) => ({ name: x.name, role: x.role, type: x.type === 'client' ? 'cliente' : 'interno' })),
      meetings: meetingsOf(p.id).slice(0, 15).map((m) => ({ meetingId: m.id, date: m.date, type: typeLabel(m.type), summary: m.minutes?.summary || '', decisions: m.minutes?.decisions || [], openPoints: m.minutes?.openPoints || [] })),
      todos: todosOf(p.id).map((t) => ({ todoId: t.id, task: t.task, owner: t.owner || null, dueDate: t.dueDate || null, status: t.status === 'done' ? 'hecho' : isOverdue(t) ? 'vencido' : 'pendiente', meetingDate: meeting(t.meetingId)?.date || null })),
    })),
    documentosAdjuntos: S.docs.map((d) => ({ documentId: d.id, name: d.name, words: d.words, start: d.text.slice(0, 1500) })),
  };
  return `Eres el asistente de proyectos de Lukkap, una consultora de experiencia de cliente y de empleado. Ayudas a una consultora a gestionar sus proyectos, actas de reunión y to-do's.

Hoy es ${fmtDate(today)} (${today}).

Cómo trabajas:
- Usa solo los datos de abajo y tus herramientas. Si algo no está en los datos, dilo; no inventes.
- Para cambiar algo usa las herramientas. Crear proyectos, añadir participantes y cambiar to-do's crea una propuesta que el usuario confirma en pantalla: no digas que está hecho hasta que lo veas en las «Novedades» de un mensaje posterior.
- Para un acta necesitas proyecto, fecha, tipo de reunión (interna o externa), tipo de documento (transcript o notas) y un documento adjunto. Deduce del documento lo que diga claramente (fecha, asistentes, cliente) y pregunta solo lo que falte. Si asisten personas que no están en el proyecto, propón añadirlas con propose_participant en la misma respuesta.
- El acta se prepara en segundo plano y aparece en una tarjeta; el usuario la revisa y la guarda. La app verifica las citas literales.
- El email al cliente solo se redacta para reuniones externas ya guardadas. Si en la reunión hubo varios internos y no sabes quién firma, pregunta.
- El presupuesto es confidencial: puedes comentarlo con el usuario, pero nunca lo incluyas en actas ni emails.
- Cuando respondas sobre reuniones, cita la fuente así: (Reunión DD/MM/AAAA, Externa).
- Responde en español de España, breve y directo, en texto plano sin emojis ni markdown; usa guiones para las listas.

Datos actuales (JSON):
${JSON.stringify(data)}`;
}

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

function projectByCode(code) {
  const p = S.projects.find((x) => x.code.toLowerCase() === String(code || '').trim().toLowerCase());
  if (!p) throw new Error(`No existe ningún proyecto con el código «${code}». Los códigos válidos están en los datos.`);
  return p;
}

function addCard(card) {
  const item = { type: 'card', id: newId(), state: 'pending', ...card };
  S.chat.push(item);
  if (S.view.name === 'assistant') {
    app.querySelector('.chat-log')?.insertAdjacentHTML('beforeend', cardHtml(item));
    scrollChat();
  }
  return item;
}

function refreshCard(card) {
  const el = app.querySelector(`[data-card-id="${card.id}"]`);
  if (el) el.outerHTML = cardHtml(card);
}

async function runMinutesCard(card) {
  card.state = 'working';
  card.progress = 'Redactando el acta…';
  refreshCard(card);
  try {
    const result = await buildMinutes({ text: card.form.text, ctx: minutesContext(card.form), onProgress: (text) => { if (text) { card.progress = text; refreshCard(card); } } });
    card.form.cardId = card.id;
    card.draft = draftFromForm(card.form, result);
    card.state = 'ready';
    const m = result.minutes;
    const unverified = m.findings.reduce((n, f) => n + f.quotes.filter((q) => !q.verified).length, 0);
    const noOwner = m.todos.filter((t) => !t.owner).length;
    card.stats = { findings: m.findings.length, unverified, todos: m.todos.length, noOwner };
    S.agentNotes.push(`El borrador del acta del ${fmtDate(card.form.date)} (${project(card.form.projectId)?.code}) está listo para que el usuario lo revise: ${m.findings.length} hallazgos, ${unverified} citas sin verificar, ${m.todos.length} to-do's${noOwner ? `, ${noOwner} sin responsable` : ''}. Aún no está guardado.`);
  } catch (e) {
    console.error(e);
    card.state = 'error';
    card.error = aiMessage(e);
  }
  refreshCard(card);
}

async function runEmailCard(card) {
  card.state = 'working';
  refreshCard(card);
  const m = meeting(card.meetingId);
  const p = project(m.projectId);
  try {
    const { text } = await S.sample(emailPrompt(m, p, card.opts), { modelTier: 'default', cache: false });
    card.subject = `${p.name} - ${card.opts.lang === 'en' ? 'Meeting summary' : 'Resumen reunión'} ${fmtDate(m.date)}`;
    card.body = text.trim();
    card.state = 'ready';
  } catch (e) {
    console.error(e);
    card.state = 'error';
    card.error = aiMessage(e);
  }
  refreshCard(card);
}

function agentTools() {
  return [
    {
      name: 'prepare_minutes',
      description: 'Starts drafting the minutes of a meeting from a document attached in the chat. Runs in the background (1-2 minutes) and shows a card where the user reviews and saves them; returns at once. Call it only when project, date, meeting type and document type are known.',
      inputSchema: {
        type: 'object',
        properties: {
          projectCode: { type: 'string' },
          documentId: { type: 'string' },
          date: { type: 'string', description: 'Meeting date, YYYY-MM-DD' },
          meetingType: { type: 'string', enum: ['internal', 'external'] },
          sourceType: { type: 'string', enum: ['transcript', 'notes'] },
          participantNames: { type: 'array', items: { type: 'string' }, description: 'People who attended' },
        },
        required: ['projectCode', 'documentId', 'date', 'meetingType', 'sourceType'],
      },
      execute(input) {
        const p = projectByCode(input.projectCode);
        const doc = S.docs.find((d) => d.id === String(input.documentId));
        if (!doc) throw new Error('No hay ningún documento con ese identificador. Pide al usuario que lo adjunte.');
        if (!DATE_RE.test(String(input.date))) throw new Error('La fecha debe tener el formato AAAA-MM-DD.');
        const people = p.participants || [];
        const ids = [];
        const unknown = [];
        (Array.isArray(input.participantNames) ? input.participantNames : []).map((n) => String(n).trim()).filter(Boolean).forEach((name) => {
          const low = name.toLowerCase();
          const hit = people.find((x) => x.name.toLowerCase() === low) || people.find((x) => x.name.toLowerCase().includes(low) || low.includes(x.name.toLowerCase()));
          if (hit) { if (!ids.includes(hit.id)) ids.push(hit.id); } else unknown.push(name);
        });
        const form = {
          projectId: p.id, client: p.client, date: String(input.date), type: input.meetingType === 'internal' ? 'internal' : 'external', participantIds: ids,
          sourceType: input.sourceType === 'notes' ? 'notes' : 'transcript', fileName: doc.name, text: doc.text,
          adding: false, newPerson: { name: '', role: '', type: 'client' }, errors: {}, fromAgent: true,
        };
        const card = addCard({ kind: 'minutes', form, state: 'working', progress: 'Redactando el acta…' });
        runMinutesCard(card);
        return { status: 'started', project: p.code, attendeesMatched: ids.length, attendeesNotInProject: unknown };
      },
    },
    {
      name: 'propose_project',
      description: 'Proposes creating a new project. Shows a card the user must confirm; nothing is saved until then. Throws with the reason if a field is missing or invalid (for example, a duplicate code): ask the user for it.',
      inputSchema: {
        type: 'object',
        properties: {
          client: { type: 'string' }, code: { type: 'string' }, name: { type: 'string' },
          startDate: { type: 'string', description: 'YYYY-MM-DD' }, endDate: { type: 'string', description: 'YYYY-MM-DD' },
          budgetEUR: { type: 'number' },
          participants: { type: 'array', items: { type: 'object', properties: { name: { type: 'string' }, role: { type: 'string' }, type: { type: 'string', enum: ['client', 'internal'] } }, required: ['name', 'type'] } },
        },
        required: ['client', 'code', 'name', 'startDate', 'endDate', 'budgetEUR'],
      },
      execute(input) {
        const fields = {
          client: String(input.client || ''), code: String(input.code || ''), name: String(input.name || ''),
          startDate: DATE_RE.test(String(input.startDate)) ? String(input.startDate) : '', endDate: DATE_RE.test(String(input.endDate)) ? String(input.endDate) : '',
          budget: input.budgetEUR, people: Array.isArray(input.participants) ? input.participants.map((x) => ({ name: String(x?.name || ''), role: String(x?.role || ''), type: x?.type === 'internal' ? 'internal' : 'client' })) : [],
        };
        const errors = Object.values(validateProject(fields));
        if (errors.length) throw new Error(errors.join(' '));
        addCard({ kind: 'project', fields });
        return { status: 'waiting_for_user_confirmation' };
      },
    },
    {
      name: 'propose_participant',
      description: 'Proposes adding a person to a project team. Shows a card the user must confirm.',
      inputSchema: { type: 'object', properties: { projectCode: { type: 'string' }, name: { type: 'string' }, role: { type: 'string' }, type: { type: 'string', enum: ['client', 'internal'] } }, required: ['projectCode', 'name', 'type'] },
      execute(input) {
        const p = projectByCode(input.projectCode);
        const name = String(input.name || '').trim();
        if (!name) throw new Error('Falta el nombre de la persona.');
        if ((p.participants || []).some((x) => x.name.toLowerCase() === name.toLowerCase())) throw new Error(`${name} ya está en el proyecto.`);
        addCard({ kind: 'participant', projectId: p.id, person: { name, role: String(input.role || '').trim(), type: input.type === 'internal' ? 'internal' : 'client' } });
        return { status: 'waiting_for_user_confirmation' };
      },
    },
    {
      name: 'propose_todo_update',
      description: 'Proposes changing a to-do (status, owner or due date) or deleting it. Shows a card the user must confirm. Use an empty string to clear owner or due date.',
      inputSchema: {
        type: 'object',
        properties: {
          todoId: { type: 'string' }, status: { type: 'string', enum: ['pending', 'done'] }, owner: { type: 'string' },
          dueDate: { type: 'string', description: 'YYYY-MM-DD, or empty to clear' }, remove: { type: 'boolean', description: 'true to delete the to-do' },
        },
        required: ['todoId'],
      },
      execute(input) {
        const t = S.todos.find((x) => x.id === String(input.todoId));
        if (!t) throw new Error('No existe ningún to-do con ese identificador.');
        const changes = {};
        if (input.status === 'done' || input.status === 'pending') changes.status = input.status;
        if (typeof input.owner === 'string') changes.owner = input.owner.trim();
        if (typeof input.dueDate === 'string') {
          if (input.dueDate && !DATE_RE.test(input.dueDate)) throw new Error('La fecha debe tener el formato AAAA-MM-DD.');
          changes.dueDate = input.dueDate;
        }
        if (!input.remove && !Object.keys(changes).length) throw new Error('No has indicado ningún cambio.');
        addCard({ kind: 'todo', todoId: t.id, changes, remove: Boolean(input.remove) });
        return { status: 'waiting_for_user_confirmation' };
      },
    },
    {
      name: 'draft_client_email',
      description: 'Drafts the follow-up email to the client for a saved external meeting. Runs in the background and shows the draft in a card the user can copy; returns at once.',
      inputSchema: { type: 'object', properties: { meetingId: { type: 'string' }, sender: { type: 'string', description: 'Name of the internal person who signs' }, language: { type: 'string', enum: ['es', 'en'] } }, required: ['meetingId', 'sender'] },
      execute(input) {
        const m = meeting(String(input.meetingId));
        if (!m) throw new Error('No existe esa reunión guardada. Si el acta aún no está guardada, el usuario debe guardarla primero.');
        if (m.type !== 'external') throw new Error('Solo se redacta email al cliente para reuniones externas.');
        const sender = String(input.sender || '').trim();
        if (!sender) throw new Error('Falta quién firma el email.');
        const card = addCard({ kind: 'email', meetingId: m.id, state: 'working', opts: { sender, lang: input.language === 'en' ? 'en' : 'es' } });
        runEmailCard(card);
        return { status: 'started' };
      },
    },
    {
      name: 'read_minutes',
      description: 'Returns the full saved minutes of one meeting, including findings with their verbatim quotes.',
      inputSchema: { type: 'object', properties: { meetingId: { type: 'string' } }, required: ['meetingId'] },
      execute(input) {
        const m = meeting(String(input.meetingId));
        if (!m) throw new Error('No existe esa reunión.');
        const mi = m.minutes || {};
        return { date: m.date, type: typeLabel(m.type), summary: mi.summary, findings: mi.findings, decisions: mi.decisions, openPoints: mi.openPoints };
      },
    },
  ];
}

function addDoc(name, text) {
  const doc = { id: `D${S.docs.length + 1}`, name, text, words: wordCount(text) };
  S.docs.push(doc);
  return doc;
}

async function sendToAgent(raw) {
  if (S.agentRun) return;
  let text = String(raw || '').trim();
  // Long pasted text becomes an attached document instead of a chat message.
  if (text.length > 2500) {
    S.pendingDocs.push(addDoc('Texto pegado', text));
    text = '';
  }
  const docs = S.pendingDocs.splice(0);
  if (!text && !docs.length) return;
  if (!text) text = 'Prepara el acta de este documento.';
  S.chatInput = '';
  S.chat.push({ role: 'user', text, docs: docs.map((d) => `${d.name} · ${d.words.toLocaleString('es-ES')} palabras`) });
  const notes = S.agentNotes.splice(0);
  const content = [
    notes.length ? `Novedades desde mi último mensaje: ${notes.join(' ')}` : '',
    text,
    docs.length ? `Documentos adjuntos: ${docs.map((d) => `${d.id} «${d.name}» (${d.words} palabras)`).join('; ')}.` : '',
  ].filter(Boolean).join('\n\n');
  S.history.push({ role: 'user', content });
  const bubble = { role: 'assistant', text: '', streaming: true };
  S.chat.push(bubble);
  const ctl = new AbortController();
  S.agentRun = ctl;
  render();
  scrollChat();
  try {
    const { text: answer } = await S.sample([{ role: 'user', content: agentInstructions() }, ...S.history.slice(-20)], {
      tools: agentTools(),
      signal: ctl.signal,
      modelTier: 'default',
      onText: ({ text: soFar }) => { bubble.text = soFar; updateBubble(bubble); },
    });
    bubble.text = answer;
  } catch (e) {
    console.error(e);
    bubble.text = e?.text || '';
    if (e?.code !== 'cancelled') bubble.error = aiMessage(e);
  }
  bubble.streaming = false;
  if (bubble.text) S.history.push({ role: 'assistant', content: bubble.text });
  S.agentRun = null;
  if (S.view.name === 'assistant') { render(); scrollChat(); }
}

function updateBubble(bubble) {
  const el = app.querySelector(`[data-msg="${S.chat.indexOf(bubble)}"] .bubble`);
  if (el) { el.textContent = plain(bubble.text); el.classList.remove('thinking'); }
}

function scrollChat() {
  if (S.view.name !== 'assistant') return;
  app.querySelector('.composer')?.scrollIntoView({ block: 'end' });
}

const plain = (t) => String(t || '').replace(/\*\*(.+?)\*\*/g, '$1');

function cardHtml(c) {
  const wrap = (eyebrow, inner) => `<section class="agent-card" data-card-id="${esc(c.id)}"><span class="eyebrow">${eyebrow}</span>${inner}</section>`;
  const decision = c.state === 'pending'
    ? `<div class="row"><button class="btn btn-small btn-primary" type="button" data-act="card-confirm" data-card="${esc(c.id)}">Confirmar</button><button class="btn-link" type="button" data-act="card-discard" data-card="${esc(c.id)}">Descartar</button></div>`
    : c.state === 'confirmed' ? '<span class="chip chip-ok">Confirmado y guardado</span>'
    : c.state === 'discarded' ? '<span class="chip chip-plain">Descartado</span>'
    : c.state === 'error' ? `<p class="err">${WARN}${esc(c.error)}</p>` : '';
  const working = (text) => `<div class="inline-dots"><div class="dots"><i></i><i></i><i></i></div><span>${esc(text)}</span></div>`;

  if (c.kind === 'minutes') {
    const p = project(c.form.projectId);
    const head = `<h3>${esc(p?.code || '')} · Reunión ${typeLabel(c.form.type).toLowerCase()} del ${fmtDate(c.form.date)}</h3><p class="hint">${esc(c.form.fileName)}</p>`;
    if (c.state === 'working') return wrap('Preparando el acta', head + working(c.progress || 'Redactando el acta…'));
    if (c.state === 'error') return wrap('Acta', `${head}<p class="err">${WARN}${esc(c.error)}</p><div><button class="btn btn-small" type="button" data-act="card-retry" data-card="${esc(c.id)}">Reintentar</button></div>`);
    if (c.state === 'saved') return wrap('Acta guardada', `${head}<div><button class="btn btn-small" type="button" data-go="minutes" data-id="${esc(c.meetingId)}">Ver acta</button></div>`);
    const s = c.stats;
    return wrap('Borrador del acta listo', `${head}
      <div class="chips"><span class="chip">${s.findings} hallazgos</span>${s.unverified ? `<span class="chip chip-alert">${WARN} ${s.unverified} ${s.unverified === 1 ? 'cita sin verificar' : 'citas sin verificar'}</span>` : '<span class="chip chip-ok">Citas verificadas</span>'}<span class="chip">${s.todos} to-do's</span>${s.noOwner ? `<span class="chip chip-plain">${s.noOwner} sin responsable</span>` : ''}</div>
      <p>${esc(c.draft.minutes.summary)}</p>
      <div><button class="btn btn-small btn-primary" type="button" data-act="card-review" data-card="${esc(c.id)}">Revisar y guardar</button></div>`);
  }
  if (c.kind === 'email') {
    const m = meeting(c.meetingId);
    const head = `<h3>Email al cliente · reunión del ${fmtDate(m?.date)}</h3>`;
    if (c.state === 'working') return wrap('Redactando el email', head + working('Claude está redactando el email…'));
    if (c.state === 'error') return wrap('Email', `${head}<p class="err">${WARN}${esc(c.error)}</p><div><button class="btn btn-small" type="button" data-act="card-retry" data-card="${esc(c.id)}">Reintentar</button></div>`);
    return wrap('Borrador del email', `${head}<p class="hint">Asunto: ${esc(c.subject)} · <span class="num">${wordCount(c.body)}</span> palabras</p><pre>${esc(c.body)}</pre>
      <div class="row"><button class="btn btn-small btn-primary" type="button" data-act="card-copy" data-card="${esc(c.id)}">Copiar</button><button class="btn btn-small" type="button" data-act="card-edit-email" data-card="${esc(c.id)}">Abrir en el editor</button></div>`);
  }
  if (c.kind === 'project') {
    const f = c.fields;
    const team = (type) => f.people.filter((x) => x.type === type).map((x) => `${x.name}${x.role ? ` (${x.role})` : ''}`).join(', ') || '—';
    return wrap('Propuesta · nuevo proyecto', `<h3>${esc(f.code)} · ${esc(f.name)}</h3>
      <dl class="facts"><div><dt>Cliente</dt><dd>${esc(f.client)}</dd></div><div><dt>Fechas</dt><dd class="num">${fmtDate(f.startDate)} – ${fmtDate(f.endDate)}</dd></div><div><dt>Presupuesto</dt><dd class="num">${fmtEur(f.budget)}</dd></div></dl>
      <p class="hint">Equipo del cliente: ${esc(team('client'))}<br>Equipo interno: ${esc(team('internal'))}</p>${decision}`);
  }
  if (c.kind === 'participant') {
    const p = project(c.projectId);
    return wrap('Propuesta · añadir participante', `<h3>${esc(personLabel(c.person))}</h3><p class="hint">Proyecto ${esc(p?.code)} · ${esc(p?.name)}</p>${decision}`);
  }
  if (c.kind === 'todo') {
    const t = S.todos.find((x) => x.id === c.todoId) || c.snapshot || {};
    const lines = c.remove ? ['Eliminar este to-do'] : [
      c.changes.status ? `Estado: ${c.changes.status === 'done' ? 'hecho' : 'pendiente'}` : '',
      'owner' in c.changes ? `Responsable: ${c.changes.owner || 'por definir'}` : '',
      'dueDate' in c.changes ? `Fecha límite: ${c.changes.dueDate ? fmtDate(c.changes.dueDate) : 'por definir'}` : '',
    ].filter(Boolean);
    return wrap(c.remove ? 'Propuesta · eliminar to-do' : 'Propuesta · cambiar to-do', `<h3>${esc(t.task || 'To-do')}</h3><ul class="read-list">${lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>${decision}`);
  }
  return '';
}

async function confirmCard(c) {
  let ok = false;
  if (c.kind === 'project') {
    const errors = Object.values(validateProject(c.fields));
    if (errors.length) { c.state = 'error'; c.error = errors.join(' '); refreshCard(c); return; }
    const id = newId();
    const data = projectDoc(c.fields);
    ok = await write(() => S.db.collection('projects').doc(id).set(data), 'Proyecto creado');
    if (ok) { S.projects = [...S.projects, { id, ...data }]; S.agentNotes.push(`El usuario confirmó la creación del proyecto ${data.code}.`); }
  }
  if (c.kind === 'participant') {
    const p = project(c.projectId);
    const participants = [...(p.participants || []), { id: newId(), ...c.person }];
    ok = await write(() => S.db.collection('projects').doc(p.id).update({ participants }), 'Participante añadido');
    if (ok) { p.participants = participants; S.agentNotes.push(`El usuario confirmó añadir a ${c.person.name} al proyecto ${p.code}.`); }
  }
  if (c.kind === 'todo') {
    const t = S.todos.find((x) => x.id === c.todoId);
    if (!t) { c.state = 'error'; c.error = 'Este to-do ya no existe.'; refreshCard(c); return; }
    c.snapshot = { task: t.task };
    if (c.remove) {
      ok = await write(() => S.db.collection('todos').doc(t.id).delete(), 'To-do eliminado');
    } else {
      const changes = { ...c.changes };
      if (changes.status) changes.doneAt = changes.status === 'done' ? todayIso() : '';
      ok = await write(() => S.db.collection('todos').doc(t.id).update(changes), 'To-do actualizado');
    }
    if (ok) S.agentNotes.push(`El usuario confirmó ${c.remove ? 'eliminar' : 'cambiar'} el to-do «${t.task}».`);
  }
  if (ok) { c.state = 'confirmed'; S.error = null; }
  if (S.view.name === 'assistant') render();
}

function viewAssistant() {
  const unavailable = !S.sample
    ? 'El asistente solo funciona al abrir la app desde Claude con tu sesión iniciada.'
    : !S.toolsOk ? 'Tu versión de Claude todavía no permite que el asistente use las herramientas de la app. Puedes seguir usando las demás pantallas.' : '';
  const items = S.chat.map((item, i) => {
    if (item.type === 'card') return cardHtml(item);
    if (item.role === 'user') {
      return `<div class="msg msg-user" data-msg="${i}">${item.text ? `<p class="bubble">${esc(item.text)}</p>` : ''}${item.docs?.length ? `<div class="chips">${item.docs.map((d) => `<span class="chip chip-plain">Adjunto: ${esc(d)}</span>`).join('')}</div>` : ''}</div>`;
    }
    const thinking = item.streaming && !item.text;
    return `<div class="msg msg-ai" data-msg="${i}">${item.text || item.streaming ? `<p class="bubble ${thinking ? 'thinking' : ''}">${thinking ? 'Pensando…' : esc(plain(item.text))}</p>` : ''}${item.error ? `<div class="alert warn" role="alert">${WARN}<div><p>${esc(item.error)}</p></div></div>` : ''}</div>`;
  }).join('');
  const suggestions = `<div class="suggestions">
      <p class="muted">Prueba a pedirle, por ejemplo:</p>
      <button class="suggestion" type="button" data-act="chat-suggest" data-sample="1" data-text="Prepara el acta de esta reunión con Hoteles Brisa del Sur.">Prepara el acta del transcript de ejemplo de Brisa del Sur</button>
      <button class="suggestion" type="button" data-act="chat-suggest" data-text="¿Qué to-do's tengo vencidos o sin responsable?">¿Qué to-do's tengo vencidos o sin responsable?</button>
      <button class="suggestion" type="button" data-act="chat-suggest" data-text="Resúmeme cómo va el proyecto de Grupo Alimentario Norte.">Resúmeme cómo va el proyecto de Grupo Alimentario Norte</button>
    </div>`;
  return `${pageHead('Asistente', 'Pídele lo que necesites con tus palabras. Antes de guardar o cambiar nada, te pedirá confirmación.')}
    ${unavailable ? `<div class="alert warn">${WARN}<div><p>${unavailable}</p></div></div>` : ''}
    <section class="chat" aria-label="Conversación con el asistente">
      <div class="chat-log" aria-live="polite">${items || suggestions}</div>
      ${errorBox()}
      <div class="composer">
        ${S.pendingDocs.length ? `<div class="chips">${S.pendingDocs.map((d, i) => `<span class="chip chip-plain">Adjunto: ${esc(d.name)} · ${d.words.toLocaleString('es-ES')} palabras <button class="btn-link" type="button" data-act="chat-remove-doc" data-i="${i}" aria-label="Quitar ${esc(d.name)}">Quitar</button></span>`).join('')}</div>` : ''}
        <label class="visually-hidden" for="chat-input">Mensaje para el asistente</label>
        <textarea id="chat-input" rows="3" placeholder="Escribe tu mensaje. Puedes pegar aquí un transcript completo." ${unavailable ? 'disabled' : ''}>${esc(S.chatInput)}</textarea>
        <div class="row">
          <div class="row">
            <span class="btn btn-small file-btn">Adjuntar archivo<input type="file" id="chat-file" data-act="chat-file" accept=".txt,.vtt,.docx" aria-label="Adjuntar archivo .txt, .vtt o .docx" ${unavailable ? 'disabled' : ''}></span>
            <button class="btn btn-small" type="button" data-act="chat-sample" ${unavailable ? 'disabled' : ''}>Adjuntar transcript de ejemplo</button>
          </div>
          ${S.agentRun
            ? '<button class="btn btn-danger" type="button" data-act="chat-stop">Detener</button>'
            : `<button class="btn btn-primary" type="button" data-act="chat-send" ${unavailable ? 'disabled' : ''}>Enviar</button>`}
        </div>
        <p class="hint">Intro para enviar · Mayús+Intro para nueva línea</p>
      </div>
    </section>`;
}

function setPath(obj, path, value) {
  const keys = path.split('.');
  const last = keys.pop();
  const target = keys.reduce((o, k) => o[k], obj);
  target[last] = value;
}

app.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'chat-input') { S.chatInput = el.value; return; }
  const value = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.bind && S.form) {
    setPath(S.form, el.dataset.bind, value);
    if (S.view.name === 'email') {
      const w = wordCount(S.form.body);
      const out = app.querySelector('#e-words');
      if (out) out.textContent = `${w} palabras${w > 200 ? ' · supera el máximo de 200' : ''}`;
      const link = app.querySelector('#e-mailto');
      if (link) link.href = mailto(S.form);
    }
  }
  if (el.dataset.person !== undefined) S.form.people[Number(el.dataset.person)][el.dataset.key] = value;
  if (el.dataset.draft && S.draft) {
    setPath(S.draft.minutes, el.dataset.draft, value);
    const qm = el.dataset.draft.match(/^findings\.(\d+)\.quotes\.(\d+)\.quote$/);
    if (qm) {
      const q = S.draft.minutes.findings[qm[1]].quotes[qm[2]];
      q.verified = verifyQuote(q.quote, normalize(S.draft.sourceText));
      const box = el.closest('.quote');
      box.classList.toggle('bad', !q.verified);
      box.querySelector('.status').outerHTML = quoteStatus(q);
    }
  }
  if (el.dataset.draftLines && S.draft) S.draft.minutes[el.dataset.draftLines] = value.split('\n');
});

app.addEventListener('change', async (ev) => {
  const el = ev.target;
  const act = el.dataset.act;
  if (el.dataset.bind && el.dataset.rerender) { render(); return; }
  if (el.type === 'radio' && el.dataset.bind) { setPath(S.form, el.dataset.bind, el.value); return; }
  if (act === 'pick-client') {
    S.form.client = el.value;
    const ofClient = activeProjects().filter((p) => p.client === el.value);
    S.form.projectId = ofClient.length === 1 ? ofClient[0].id : '';
    if (S.view.name === 'meeting') { S.form.participantIds = []; S.form.adding = false; }
    delete S.form.errors?.projectId;
    render();
  }
  if (act === 'pick-project') {
    S.form.projectId = el.value;
    if (S.view.name === 'meeting') { S.form.participantIds = []; S.form.adding = false; }
    delete S.form.errors?.projectId;
    render();
  }
  if (act === 'toggle-participant') {
    const ids = S.form.participantIds;
    if (el.checked) ids.push(el.value); else ids.splice(ids.indexOf(el.value), 1);
  }
  if (act === 'chat-file' && el.files[0]) {
    try {
      const text = await readFile(el.files[0]);
      S.pendingDocs.push(addDoc(el.files[0].name, text));
      S.error = null;
    } catch (e) {
      S.error = { message: e.message || 'No se ha podido leer el archivo.' };
    }
    render();
    app.querySelector('#chat-input')?.focus();
    return;
  }
  if (act === 'file' && el.files[0]) {
    try {
      S.form.text = await readFile(el.files[0]);
      S.form.fileName = el.files[0].name;
      delete S.form.errors.text;
    } catch (e) {
      S.form.errors.text = e.message || 'No se ha podido leer el archivo.';
    }
    render();
  }
});

app.addEventListener('keydown', (ev) => {
  if (ev.target.id === 'chat-input' && ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();
    sendToAgent(ev.target.value);
  }
});

app.addEventListener('submit', (ev) => {
  ev.preventDefault();
  if (ev.target.id === 'new-project') saveProject();
  if (ev.target.id === 'meeting-form') {
    const f = S.form;
    f.errors = {};
    if (!f.projectId) f.errors.projectId = 'Elige el cliente y el proyecto.';
    if (wordCount(f.text) < 30) f.errors.text = 'Sube un archivo o pega el texto de la reunión (al menos unas líneas).';
    S.error = null;
    if (Object.keys(f.errors).length) { render(); return; }
    generateMinutes();
  }
});

document.addEventListener('click', async (ev) => {
  const goEl = ev.target.closest('[data-go]');
  if (goEl) {
    const params = goEl.dataset.id ? (['meeting', 'todos'].includes(goEl.dataset.go) ? { projectId: goEl.dataset.id } : { id: goEl.dataset.id }) : {};
    if (goEl.dataset.go === 'meeting' && S.view.name === 'review' && S.form) { S.view = { name: 'meeting' }; render(); return; }
    go(goEl.dataset.go, params);
    return;
  }
  const el = ev.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'file') return;
  const act = el.dataset.act;
  const f = S.form;
  const d = S.draft;
  switch (act) {
    case 'retry':
      if (S.error?.retry === 'minutes') { S.error = null; S.view = { name: 'meeting' }; generateMinutes(); }
      else if (S.error?.retry === 'email') generateEmail();
      break;
    case 'add-person': f.people.push({ name: '', role: '', type: el.dataset.type }); render(); break;
    case 'remove-person': f.people.splice(Number(el.dataset.i), 1); render(); break;
    case 'open-add-participant': f.adding = true; render(); app.querySelector('#np-name')?.focus(); break;
    case 'cancel-participant': f.adding = false; delete f.errors.newPerson; render(); break;
    case 'save-participant': saveParticipant(); break;
    case 'load-sample': f.text = SAMPLE.text; f.fileName = SAMPLE.fileName; f.sourceType = 'transcript'; f.type = 'external'; delete f.errors.text; render(); break;
    case 'remove-quote': d.minutes.findings[el.dataset.i].quotes.splice(Number(el.dataset.j), 1); S.view.confirmUnverified = false; render(); break;
    case 'remove-finding': d.minutes.findings.splice(Number(el.dataset.i), 1); S.view.confirmUnverified = false; render(); break;
    case 'add-todo-row': d.minutes.todos.push({ task: '', owner: '', dueDate: '' }); render(); break;
    case 'remove-todo-row': d.minutes.todos.splice(Number(el.dataset.i), 1); render(); break;
    case 'save-minutes': saveMinutes(Boolean(el.dataset.force)); break;
    case 'cancel-force': S.view.confirmUnverified = false; render(); break;
    case 'regenerate': S.view = { name: 'meeting' }; S.draft = null; generateMinutes(); break;
    case 'download-word': el.disabled = true; await downloadWord(); el.disabled = false; break;
    case 'gen-email': generateEmail(); break;
    case 'copy-email': {
      const text = `Asunto: ${f.subject}\n\n${f.body}`;
      try { await navigator.clipboard.writeText(text); toast('Email copiado'); }
      catch { const ta = app.querySelector('#e-body'); ta.focus(); ta.select(); toast('Pulsa Ctrl+C para copiar el mensaje'); }
      break;
    }
    case 'toggle-done': {
      const t = S.todos.find((x) => x.id === el.dataset.id);
      const done = t.status !== 'done';
      await write(() => S.db.collection('todos').doc(t.id).update({ status: done ? 'done' : 'pending', doneAt: done ? todayIso() : '' }), done ? 'Tarea marcada como hecha' : 'Tarea reabierta');
      break;
    }
    case 'edit-todo': S.editTodo = el.dataset.id; S.confirm = null; render(); app.querySelector('#et-task')?.focus(); break;
    case 'cancel-edit': S.editTodo = null; render(); break;
    case 'save-todo': {
      const task = app.querySelector('#et-task').value.trim();
      if (!task) { app.querySelector('#et-task').setAttribute('aria-invalid', 'true'); return; }
      const ok = await write(() => S.db.collection('todos').doc(el.dataset.id).update({ task, owner: app.querySelector('#et-owner').value.trim(), dueDate: app.querySelector('#et-due').value }), 'Tarea actualizada');
      if (ok) { S.editTodo = null; render(); }
      break;
    }
    case 'ask-delete': S.confirm = el.dataset.id; S.editTodo = null; render(); break;
    case 'cancel-delete': S.confirm = null; render(); break;
    case 'delete-todo': {
      const ok = await write(() => S.db.collection('todos').doc(el.dataset.id).delete(), 'Tarea eliminada');
      if (ok) { S.confirm = null; render(); }
      break;
    }
    case 'download-csv': downloadCsv(); break;
    case 'chat-send': sendToAgent(app.querySelector('#chat-input')?.value); break;
    case 'chat-stop': S.agentRun?.abort(); break;
    case 'chat-sample':
      S.pendingDocs.push(addDoc(SAMPLE.fileName, SAMPLE.text));
      render();
      app.querySelector('#chat-input')?.focus();
      break;
    case 'chat-suggest':
      if (el.dataset.sample) S.pendingDocs.push(addDoc(SAMPLE.fileName, SAMPLE.text));
      sendToAgent(el.dataset.text);
      break;
    case 'chat-remove-doc': S.pendingDocs.splice(Number(el.dataset.i), 1); render(); break;
    case 'card-confirm': case 'card-discard': case 'card-review': case 'card-retry': case 'card-copy': case 'card-edit-email': {
      const card = S.chat.find((x) => x.id === el.dataset.card);
      if (!card) break;
      if (act === 'card-confirm') { el.disabled = true; await confirmCard(card); }
      if (act === 'card-discard') { card.state = 'discarded'; S.agentNotes.push('El usuario descartó una de tus propuestas.'); refreshCard(card); }
      if (act === 'card-review') { S.form = card.form; S.draft = card.draft; S.view = { name: 'review' }; S.error = null; render(); window.scrollTo(0, 0); }
      if (act === 'card-retry') (card.kind === 'email' ? runEmailCard : runMinutesCard)(card);
      if (act === 'card-copy') {
        const text = `Asunto: ${card.subject}\n\n${card.body}`;
        try { await navigator.clipboard.writeText(text); toast('Email copiado'); } catch { toast('No se ha podido copiar. Ábrelo en el editor para copiarlo.'); }
      }
      if (act === 'card-edit-email') {
        go('email', { id: card.meetingId });
        S.form = { sender: card.opts.sender, lang: card.opts.lang, subject: card.subject, body: card.body };
        render();
      }
      break;
    }
  }
});

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

function subscribe(name) {
  S.db.collection(name).onSnapshot((snap) => {
    S[name] = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
    S.loaded[name] = true;
    const wasReady = S.ready;
    S.ready = Object.values(S.loaded).every(Boolean);
    if (!wasReady && S.ready) render();
    else if (S.ready && LIVE_VIEWS.has(S.view.name) && !S.editTodo) render();
  }, (e) => {
    console.error(e);
    S.error = { message: 'Se ha perdido la conexión con tus datos. Recarga la página.' };
    render();
  });
}

(async () => {
  const use = (name) => (window.claude?.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null));
  const [db, sample, downloads] = await Promise.all([use('db'), use('sample'), use('downloads')]);
  S.sample = sample;
  S.downloads = downloads;
  S.toolsOk = Boolean(sample && (await sample.limits().catch(() => null))?.tools);
  if (!db) { S.noDb = true; render(); return; }
  S.db = db;
  ['projects', 'meetings', 'todos'].forEach(subscribe);
})();
</script>
