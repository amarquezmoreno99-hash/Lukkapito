<title>Asistente de Proyectos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: white brand band with the logo, then one centred working column.
   Lukkap identity: navy-deep text, navy actions, blue for icons and dividers,
   orange only as an alert marker. Flat shapes, pill buttons, no shadows. */
:root {
  --navy: #1a2f51;
  --navy-deep: #1b2242;
  --blue: #359cdd;
  --orange: #ed572f;

  --bg: #ffffff;
  --surface: #ffffff;
  --card: #f4f4f4;
  --soft: #c2d2eb;
  --fg: #1b2242;
  --muted: #6d7381;
  --line: #e6e7e9;
  --control: #6d7381;
  --primary: #1a2f51;
  --primary-hover: #1b2242;
  --on-primary: #ffffff;
  --accent: #359cdd;
  --alert: #ed572f;
  --alert-soft: #fce5df;
  --ok-soft: #dcebf8;
  --header-bg: #ffffff;
  --header-fg: #1b2242;
  --header-line: #e6e7e9;

  --font: "Century Gothic", CenturyGothic, Questrial, AppleGothic, sans-serif;
  --fs-h1: 2rem;
  --fs-h2: 1.5rem;
  --fs-h3: 1.125rem;
  --fs-body: 1rem;
  --fs-sm: 0.875rem;
  --fs-xs: 0.75rem;
  --fs-foot: 0.6875rem;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r-sm: 8px; --r-pill: 9999px;
  --max: 1120px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12172b; --surface: #171d36; --card: #1e2542; --soft: #2a3a5e;
    --fg: #eef1f7; --muted: #a9b0c2; --line: #2c3556; --control: #8d95ab;
    --primary: #c2d2eb; --primary-hover: #dce6f5; --on-primary: #12172b;
    --accent: #4aaae6; --alert: #f2714e; --alert-soft: #3d2420; --ok-soft: #1f3550;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12172b; --surface: #171d36; --card: #1e2542; --soft: #2a3a5e;
  --fg: #eef1f7; --muted: #a9b0c2; --line: #2c3556; --control: #8d95ab;
  --primary: #c2d2eb; --primary-hover: #dce6f5; --on-primary: #12172b;
  --accent: #4aaae6; --alert: #f2714e; --alert-soft: #3d2420; --ok-soft: #1f3550;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-family: var(--font); font-size: 100%; line-height: 1.4; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: var(--fs-body); min-height: 100%; }
h1, h2, h3 { margin: 0; line-height: 1.1; font-weight: 700; text-wrap: balance; }
h1 { font-size: var(--fs-h1); }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); }
p { margin: 0; }
a { color: var(--fg); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

.band { background: var(--header-bg); border-bottom: 1px solid var(--header-line); }
.wrap { max-width: var(--max); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band .wrap { display: flex; align-items: center; gap: var(--s4); padding-block: var(--s3); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: var(--s4); background: none; border: 0; padding: 0; cursor: pointer; color: var(--header-fg); }
.brand img { height: 44px; width: auto; display: block; }
.brand span { padding-left: var(--s4); border-left: 1px solid var(--header-line); font-size: var(--fs-h3); font-weight: 700; }
.band nav { margin-left: auto; display: flex; gap: var(--s2); flex-wrap: wrap; }
.band nav button { background: none; border: 1px solid transparent; border-radius: var(--r-pill); padding: var(--s2) var(--s3); color: var(--header-fg); cursor: pointer; font-size: var(--fs-sm); font-weight: 700; }
.band nav button[aria-current="page"] { border-color: var(--header-fg); }

main.wrap { padding-block: var(--s6) var(--s7); display: flex; flex-direction: column; gap: var(--s6); }
footer { border-top: 1px solid var(--line); text-align: center; font-size: var(--fs-foot); padding-block: var(--s4); }

.page-head { display: flex; flex-direction: column; gap: var(--s3); }
.page-head h1::after { content: ""; display: block; width: var(--s7); height: 4px; background: var(--accent); margin-top: var(--s3); }
.page-head .row { justify-content: space-between; align-items: flex-end; }
.back { background: none; border: 0; padding: 0; color: var(--fg); text-decoration: underline; cursor: pointer; font-size: var(--fs-sm); align-self: flex-start; }

.row { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: var(--s4); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--s4); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); padding: var(--s2) var(--s5); border: 1px solid var(--primary); border-radius: var(--r-pill); background: var(--surface); color: var(--primary); font-size: var(--fs-sm); font-weight: 700; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--card); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-danger { border-color: var(--alert); background: var(--alert-soft); color: var(--fg); }
.btn-small { padding: var(--s1) var(--s3); font-size: var(--fs-xs); }
.btn-link { background: none; border: 0; padding: 0; color: var(--fg); text-decoration: underline; cursor: pointer; font-size: var(--fs-sm); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
.panel > h2 { font-size: var(--fs-h3); }

.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--s4); }
.action { display: flex; flex-direction: column; gap: var(--s3); text-align: left; padding: var(--s5); background: var(--card); border: 1px solid var(--card); border-radius: var(--r-sm); cursor: pointer; color: var(--fg); }
.action:hover { border-color: var(--accent); }
.action .ico { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #ffffff; display: grid; place-items: center; }
.action .ico svg { width: 22px; height: 22px; }
.action strong { font-size: var(--fs-h3); line-height: 1.1; }
.action span { font-size: var(--fs-sm); }

.list { list-style: none; margin: 0; padding: 0; }
.list > li { border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }
.list-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: var(--s4); flex-wrap: wrap; padding: var(--s3) 0; background: none; border: 0; text-align: left; cursor: pointer; color: var(--fg); }
.list-btn:hover strong { text-decoration: underline; }
.list-btn .meta { font-size: var(--fs-sm); color: var(--muted); }

.chips { display: flex; gap: var(--s2); flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: var(--s1); padding: 2px var(--s3); border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: 700; background: var(--soft); color: var(--fg); white-space: nowrap; }
.chip-alert { background: var(--alert-soft); box-shadow: inset 4px 0 0 var(--alert); }
.chip-ok { background: var(--ok-soft); }
.chip-plain { background: var(--card); }

.empty { text-align: center; color: var(--muted); padding: var(--s6) var(--s4); }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--s4); margin: 0; }
.facts div { display: flex; flex-direction: column; gap: var(--s1); }
.facts dt { font-size: var(--fs-xs); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.facts dd { margin: 0; font-weight: 700; }

.field { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.field > label, .field > .label, fieldset legend { font-size: var(--fs-sm); font-weight: 700; }
.field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea, .cell-input {
  width: 100%; padding: var(--s2) var(--s3); border: 1px solid var(--control); border-radius: var(--r-sm); background: var(--surface); color: var(--fg);
}
.field textarea { resize: vertical; min-height: 6rem; line-height: 1.4; }
.field [aria-invalid="true"] { border: 2px solid var(--alert); }
.hint { font-size: var(--fs-xs); color: var(--muted); }
.err { display: flex; gap: var(--s2); align-items: center; font-size: var(--fs-sm); }
.warn-ico { color: var(--alert); width: 1.1em; height: 1.1em; flex-shrink: 0; }
.chip .warn-ico { width: 1em; height: 1em; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.opts { display: flex; gap: var(--s4); flex-wrap: wrap; }
.opts label, .check { display: inline-flex; align-items: center; gap: var(--s2); cursor: pointer; }
.check-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s2) var(--s4); }
.inline-form { background: var(--card); border-radius: var(--r-sm); padding: var(--s4); display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--s3); align-items: end; }
.form-foot { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: center; }
.rows { display: flex; flex-direction: column; gap: var(--s2); }
.person-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: var(--s2); align-items: center; }

.alert { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s4); border-radius: var(--r-sm); background: var(--ok-soft); box-shadow: inset 4px 0 0 var(--accent); font-size: var(--fs-sm); }
.alert.warn { background: var(--alert-soft); box-shadow: inset 4px 0 0 var(--alert); }
.alert > div { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }

.progress { display: flex; flex-direction: column; gap: var(--s3); align-items: center; text-align: center; padding: var(--s7) var(--s4); }
.dots { display: flex; gap: var(--s2); }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .7; } }

.finding { border-top: 1px solid var(--line); padding-top: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.finding:first-of-type { border-top: 0; padding-top: 0; }
.quote { display: grid; grid-template-columns: 1fr minmax(120px, 200px) auto; gap: var(--s2); align-items: start; padding-left: var(--s3); border-left: 3px solid var(--accent); }
.quote.bad { border-left-color: var(--alert); }
.quote .status { grid-column: 1 / -1; }
blockquote { margin: 0; padding-left: var(--s3); border-left: 3px solid var(--accent); display: flex; flex-direction: column; gap: var(--s1); }
blockquote.bad { border-left-color: var(--alert); }
blockquote cite { font-style: normal; font-size: var(--fs-sm); color: var(--muted); }
.read-list { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: var(--s2); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
th, td { text-align: left; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--card); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.overdue td:first-child { box-shadow: inset 4px 0 0 var(--alert); }
tr.done td { color: var(--muted); }
tr.done .task { text-decoration: line-through; }
td .cell-input { min-width: 8rem; }
.counters { display: flex; gap: var(--s4); flex-wrap: wrap; }
.counter { background: var(--card); border-radius: var(--r-sm); padding: var(--s3) var(--s4); min-width: 120px; display: flex; flex-direction: column; gap: var(--s1); }
.counter b { font-size: var(--fs-h2); font-variant-numeric: tabular-nums; }
.counter span { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.counter.alert-c { box-shadow: inset 4px 0 0 var(--alert); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--s5) + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: var(--s3) var(--s5); border-radius: var(--r-pill); font-size: var(--fs-sm); font-weight: 700; z-index: 20; max-width: calc(100% - 32px); }

/* Assistant */
.chat { display: flex; flex-direction: column; gap: var(--s4); }
.chat-log { display: flex; flex-direction: column; gap: var(--s3); min-height: 8rem; }
.msg { display: flex; flex-direction: column; gap: var(--s2); max-width: min(760px, 100%); min-width: 0; }
.msg-user { align-self: flex-end; align-items: flex-end; }
.bubble { margin: 0; padding: var(--s3) var(--s4); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
.msg-user .bubble { background: var(--primary); color: var(--on-primary); border-radius: 16px 16px 4px 16px; }
.msg-ai .bubble { background: var(--card); border-radius: 16px 16px 16px 4px; }
.msg-ai .bubble.thinking { color: var(--muted); }
.agent-card { max-width: min(760px, 100%); border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
.agent-card > .chip, .agent-card > .err { align-self: flex-start; }
.agent-card .eyebrow { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.agent-card h3 { font-size: var(--fs-body); }
.agent-card pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: inherit; font-size: var(--fs-sm); background: var(--card); padding: var(--s3); border-radius: var(--r-sm); }
.agent-card .facts { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.agent-card .inline-dots { display: flex; gap: var(--s3); align-items: center; font-size: var(--fs-sm); }
.suggestions { display: flex; flex-direction: column; gap: var(--s2); align-items: flex-start; }
.suggestion { background: var(--card); border: 1px solid var(--card); border-radius: var(--r-pill); padding: var(--s2) var(--s4); cursor: pointer; color: var(--fg); font-size: var(--fs-sm); text-align: left; }
.suggestion:hover { border-color: var(--accent); }
.composer { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); border-top: 1px solid var(--line); padding-block: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
.composer textarea { width: 100%; padding: var(--s3); border: 1px solid var(--control); border-radius: var(--r-sm); background: var(--surface); color: var(--fg); resize: vertical; min-height: 4.5rem; }
.composer .row { justify-content: space-between; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

@media (max-width: 640px) {
  :root { --fs-h1: 1.625rem; --fs-h2: 1.25rem; }
  .brand span { display: none; }
  .band nav { margin-left: 0; width: 100%; }
  .quote { grid-template-columns: 1fr; }
  .person-row { grid-template-columns: 1fr; }
}
</style>

<script type="application/json" id="sample-transcript">{"fileName": "transcript-ejemplo-brisa-del-sur.txt", "text": "Reunión de seguimiento – Hoteles Brisa del Sur (datos ficticios para pruebas)\nFecha: 20/10/2026\nAsistentes: Marta Ruiz (Directora de Experiencia Cliente, Brisa del Sur), Jorge Ibáñez (Jefe de Recepción, Brisa del Sur), Laura Gómez (Consultora senior, Lukkap), Pablo Serrano (Analista, Lukkap)\n\nLaura Gómez: Buenos días a los dos y gracias por sacar el hueco. La idea de hoy es repasar los resultados del diagnóstico del viaje del huésped que cerramos la semana pasada y acordar los siguientes pasos. Pablo ha preparado los datos, así que en un momento le paso la palabra.\n\nMarta Ruiz: Perfecto. Te adelanto que en dirección están preocupados por la bajada del NPS de este verano. Pasamos de 52 a 41 en tres meses y nadie tiene muy claro por qué.\n\nLaura Gómez: Justo eso es lo que queremos explicar hoy. Pablo, cuando quieras.\n\nPablo Serrano: Gracias, Laura. Hemos analizado algo más de 2.300 encuestas de salida y unas 600 reseñas públicas de los cinco hoteles. El momento que más pesa en la caída del NPS es la llegada. En concreto, el 38 % de los comentarios negativos mencionan la espera en el check-in, y en agosto la espera media en hora punta superó los 25 minutos en el hotel de Málaga.\n\nJorge Ibáñez: Eso cuadra con lo que vemos en recepción. Entre las tres y las cinco de la tarde se nos junta todo: llegan los vuelos de Madrid y de Londres a la vez y tenemos tres puestos abiertos como mucho. La gente llega cansada, con niños, y la cola se ve desde la puerta.\n\nPablo Serrano: Además hay un dato que nos llamó la atención. La app del hotel permite hacer el check-in online, pero solo la usa el 9 % de los huéspedes. Y de esos, más de la mitad acaba pasando igualmente por el mostrador porque la llave digital no funciona en todas las habitaciones.\n\nMarta Ruiz: Sí, eso lo sabemos. La llave digital solo está instalada en el edificio nuevo de Málaga. En el resto de hoteles la app te deja hacer el check-in, pero luego tienes que recoger la tarjeta igualmente. Es un poco absurdo, la verdad.\n\nLaura Gómez: Es una de las conclusiones más claras del diagnóstico: la promesa digital no se cumple en el momento clave. El huésped hace el trabajo en la app y luego le tratamos como si no lo hubiera hecho. Eso genera más frustración que no tener app.\n\nJorge Ibáñez: Y luego está el tema del equipo. Este verano hemos tenido mucha rotación en recepción. En Málaga cambiamos a casi la mitad de la plantilla entre junio y septiembre. La gente nueva tarda en coger soltura con el sistema de reservas, que no es precisamente sencillo.\n\nPablo Serrano: Eso también aparece en los datos. Los comentarios que hablan de \"personal poco informado\" se duplican en julio y agosto respecto al año pasado. No es tanto un problema de amabilidad, porque la amabilidad del personal sigue siendo lo mejor valorado, sino de que no saben resolver cosas como un cambio de habitación o una factura a nombre de empresa.\n\nMarta Ruiz: Esto es importante para mí. Yo no quiero que el mensaje a dirección sea que el equipo lo hace mal. El equipo está sosteniendo el hotel con muy pocos medios.\n\nLaura Gómez: Totalmente de acuerdo, Marta, y así lo vamos a plantear en el informe. El problema está en el diseño del proceso y en las herramientas, no en las personas. De hecho, la frase que más se repite en las reseñas positivas es que el personal es encantador.\n\nMarta Ruiz: Vale. Entonces, ¿qué proponéis?\n\nLaura Gómez: Proponemos tres líneas. La primera, un piloto de check-in exprés en el hotel de Málaga, que es donde ya tenemos la llave digital. La idea es que quien haya hecho el check-in online vaya directamente a la habitación sin pasar por el mostrador. La segunda, reforzar la formación del personal nuevo con una guía rápida de los diez casos más frecuentes. Y la tercera, medir la llegada de forma continua con una encuesta corta en el momento, no solo al salir.\n\nJorge Ibáñez: El piloto me parece bien, pero hay que tener en cuenta que en diciembre empiezan las obras del vestíbulo en Málaga. Si el piloto coincide con las obras, vamos a tener ruido en los datos y los huéspedes van a estar más molestos de lo normal.\n\nPablo Serrano: Buen punto. ¿Sabes las fechas exactas de las obras?\n\nJorge Ibáñez: Me dijeron que del 1 al 20 de diciembre, pero lo confirmo con mantenimiento.\n\nLaura Gómez: Entonces lo lógico sería arrancar el piloto a mediados de noviembre y tener cuatro semanas de datos limpios antes de las obras. ¿Os encaja?\n\nMarta Ruiz: Me encaja. Lo que necesito es llevar algo concreto al comité de dirección del 12 de noviembre. Si para entonces tenemos el diseño del piloto y una estimación de impacto, mejor.\n\nLaura Gómez: Hecho. Nosotros os enviamos la propuesta detallada del piloto antes del 7 de noviembre, para que tengas tiempo de revisarla antes del comité.\n\nMarta Ruiz: Perfecto.\n\nPablo Serrano: Para la estimación de impacto necesitaría los datos de colas por franja horaria del sistema de recepción. Con los de septiembre y octubre sería suficiente.\n\nJorge Ibáñez: Eso te lo saco yo. Te lo envío el viernes 31 como muy tarde.\n\nPablo Serrano: Genial, gracias.\n\nMarta Ruiz: Otra cosa que me preocupa es el departamento de sistemas. Tienen la agenda muy cargada con la migración del sistema de reservas y no sé si van a poder dedicarle horas al piloto. Si hay que tocar la app, va a ser complicado.\n\nLaura Gómez: Lo hemos pensado. El piloto está diseñado para no tocar la app: usa el check-in online que ya existe y la llave digital que ya está instalada. Lo único que necesitamos de sistemas es que activen un aviso en la app para avisar al huésped de que puede ir directamente a la habitación.\n\nMarta Ruiz: Eso parece asumible. Aun así, lo dejo como riesgo, porque si la migración se retrasa no van a querer tocar nada.\n\nLaura Gómez: De acuerdo, lo recogemos como riesgo abierto.\n\nJorge Ibáñez: Sobre la guía para el personal nuevo, yo puedo ayudar mucho. Llevo años apuntando las dudas que me hacen los nuevos. Si queréis, os paso la lista y la usáis como base.\n\nPablo Serrano: Eso sería oro, Jorge. Así no partimos de cero.\n\nJorge Ibáñez: Os la mando junto con los datos de colas.\n\nLaura Gómez: Perfecto. Y nosotros preparamos el borrador de la guía para revisarlo juntos. Pablo, ¿te encargas tú?\n\nPablo Serrano: Sí, yo me encargo. Tendré un primer borrador para el 14 de noviembre.\n\nMarta Ruiz: Una pregunta: la encuesta corta de llegada, ¿cómo la haríamos? No quiero saturar al huésped, que ya le mandamos la encuesta de salida.\n\nPablo Serrano: La idea es una sola pregunta en la app o por SMS una hora después del check-in: \"¿Qué tal ha sido tu llegada?\", con una escala del uno al cinco y un campo de comentario opcional. Con eso tenemos una señal diaria sin cansar a nadie.\n\nMarta Ruiz: Me gusta que sea solo una pregunta. Pero el envío por SMS tiene coste y tendría que aprobarlo marketing.\n\nLaura Gómez: Entonces dejamos abierto el canal de la encuesta hasta que marketing lo valore. Mientras tanto, en el piloto la lanzamos solo por la app.\n\nMarta Ruiz: Vale, así sí.\n\nJorge Ibáñez: Una última cosa. Alguien tendría que revisar las reseñas de Google del hotel de Sevilla, porque este mes han salido varias quejas sobre el aparcamiento y no sabemos si es algo puntual o va a más.\n\nMarta Ruiz: Sí, es verdad. No sé quién lo puede mirar, lo vemos.\n\nLaura Gómez: Lo apuntamos como tarea pendiente de asignar.\n\nMarta Ruiz: Bien. Por mi parte, decidido: vamos con el piloto de check-in exprés en Málaga, empezando a mediados de noviembre, y la guía de formación en paralelo. La encuesta de llegada, de momento solo en la app.\n\nLaura Gómez: Perfecto, Marta. Resumo lo que nos llevamos: Jorge envía los datos de colas y la lista de dudas frecuentes el viernes 31; Lukkap envía la propuesta del piloto antes del 7 de noviembre; Pablo prepara el borrador de la guía para el 14 de noviembre; y queda pendiente asignar quién revisa las reseñas de Sevilla. Como riesgos, las obras del vestíbulo en diciembre y la disponibilidad de sistemas.\n\nJorge Ibáñez: Y confirmo las fechas de las obras con mantenimiento.\n\nLaura Gómez: Eso es, gracias. ¿Algo más?\n\nMarta Ruiz: Nada más. Muy útil, de verdad. Por primera vez tengo una explicación clara de lo que ha pasado con el NPS.\n\nLaura Gómez: Nos alegra mucho. Os mandamos el resumen por email esta tarde. Gracias a los dos.\n\nJorge Ibáñez: Gracias, hasta pronto.\n\nPablo Serrano: Hasta pronto.\n"}</script>

  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/>',
};
const WARN = '<svg class="warn-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 21h20L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v5M12 18v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

function todayIso() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
const fmtDate = (iso) => (iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '');
const fmtEur = (n) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(Number(n) || 0);
const typeLabel = (t) => (t === 'external' ? 'Externa' : 'Interna');
const personLabel = (p) => `${p.name}${p.role ? ` – ${p.role}` : ''} (${p.type === 'client' ? 'Cliente' : 'Interno'})`;
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : `id-${Date.now()}-${Math.random().toString(16).slice(2)}`);
const wordCount = (s) => (s.trim().match(/\S+/g) || []).length;
const isOverdue = (t) => t.status !== 'done' && t.dueDate && t.dueDate < todayIso();

function loadScript(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = resolve;
    s.onerror = () => reject(new Error(`No se ha podido cargar ${url}`));
    document.head.append(s);
  });
}

const S = {
  db: null, sample: null, downloads: null,
  ready: false, noDb: false,
  projects: [], meetings: [], todos: [],
  loaded: { projects: false, meetings: false, todos: false },
  view: { name: 'home' },
  form: null,      // values of the form currently on screen
  draft: null,     // minutes being reviewed before saving
  busy: null,      // { text } while Claude works
  error: null,     // { message, retry }
  confirm: null,   // id of the row waiting for delete confirmation
  editTodo: null,  // id of the to-do in edit mode
  toastTimer: 0,
  // Assistant
  toolsOk: false,
  chat: [],        // what the assistant screen shows: messages and cards
  history: [],     // turns sent to Claude (user / assistant text only)
  docs: [],        // documents shared in the chat: { id, name, text, words }
  pendingDocs: [], // documents attached to the message being written
  agentNotes: [],  // things that happened since the last message (confirmations, drafts ready)
  chatInput: '',
  agentRun: null,  // AbortController while the assistant works
};

const app = document.getElementById('app');
const project = (id) => S.projects.find((p) => p.id === id);
const meeting = (id) => S.meetings.find((m) => m.id === id);
const activeProjects = () => S.projects.filter((p) => p.status !== 'closed').sort((a, b) => a.client.localeCompare(b.client, 'es') || a.code.localeCompare(b.code));
const todosOf = (pid) => S.todos.filter((t) => t.projectId === pid);
const meetingsOf = (pid) => S.meetings.filter((m) => m.projectId === pid).sort((a, b) => b.date.localeCompare(a.date));

function toast(text) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = text;
  document.body.append(el);
  clearTimeout(S.toastTimer);
  S.toastTimer = setTimeout(() => el.remove(), 3200);
}

// Views that only display data re-render when the store changes; forms don't,
// so typing is never interrupted.
const LIVE_VIEWS = new Set(['home', 'project', 'minutes', 'todos']);

function go(name, params = {}) {
  S.view = { name, ...params };
  S.error = null;
  S.confirm = null;
  S.editTodo = null;
  if (name === 'newProject') S.form = { client: '', code: '', name: '', startDate: todayIso(), endDate: '', budget: '', people: [{ name: '', role: '', type: 'client' }, { name: '', role: '', type: 'internal' }], errors: {} };
  if (name === 'meeting') S.form = { projectId: params.projectId || '', client: params.projectId ? project(params.projectId)?.client : '', date: todayIso(), type: 'external', participantIds: [], sourceType: 'transcript', fileName: '', text: '', adding: false, newPerson: { name: '', role: '', type: 'client' }, errors: {} };
  if (name === 'todos') S.form = { projectId: params.projectId || S.form?.projectId || '', owner: '', showDone: false };
  if (name === 'email') S.form = { sender: '', lang: 'es', subject: '', body: '' };
  render();
  app.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function render() {
  document.querySelectorAll('.band nav button').forEach((b) => {
    const current = b.dataset.go === S.view.name || (b.dataset.go === 'home' && ['project', 'newProject', 'minutes', 'email'].includes(S.view.name)) || (b.dataset.go === 'meeting' && S.view.name === 'review' && !S.draft?.fromAgent) || (b.dataset.go === 'assistant' && S.view.name === 'review' && S.draft?.fromAgent);
    b.toggleAttribute('aria-current', current);
    if (current) b.setAttribute('aria-current', 'page');
  });
  if (S.noDb) { app.innerHTML = viewNoDb(); return; }
  if (!S.ready) return;
  const views = { home: viewHome, project: viewProject, newProject: viewNewProject, meeting: viewMeeting, review: viewReview, minutes: viewMinutes, email: viewEmail, todos: viewTodos, assistant: viewAssistant };
  app.innerHTML = (views[S.view.name] || viewHome)();
}

function pageHead(title, sub, { back, actions } = {}) {
  return `<div class="page-head">
    ${back ? `<button class="back" type="button" data-go="${back.go}" ${back.id ? `data-id="${esc(back.id)}"` : ''}>← ${esc(back.label)}</button>` : ''}
    <div class="row"><div class="stack" style="gap:var(--s3)"><h1>${esc(title)}</h1>${sub ? `<p class="muted">${sub}</p>` : ''}</div>${actions || ''}</div>
  </div>`;
}

function errorBox() {
  if (!S.error) return '';
  return `<div class="alert warn" role="alert">${WARN}<div><p>${esc(S.error.message)}</p>${S.error.retry ? '<div><button class="btn btn-small" type="button" data-act="retry">Reintentar</button></div>' : ''}</div></div>`;
}

function viewNoDb() {
  return `${pageHead('Abre la app desde Claude')}

function quoteStatus(q) {
  return q.verified
    ? '<span class="chip chip-ok status">Cita verificada en el documento</span>'
    : `<span class="chip chip-alert status">${WARN} Cita no encontrada literalmente en el documento</span>`;
}

function viewReview() {
  const d = S.draft;
  if (!d) return viewHome();
  const p = project(d.projectId);
  const m = d.minutes;
  const unverified = m.findings.reduce((n, f) => n + f.quotes.filter((q) => !q.verified).length, 0);
  const people = (p?.participants || []).filter((x) => d.participantIds.includes(x.id));
  const findings = m.findings.map((f, i) => `<div class="finding">
      <div class="field"><label for="f-${i}">Hallazgo ${i + 1}</label><textarea id="f-${i}" rows="2" data-draft="findings.${i}.text">${esc(f.text)}</textarea></div>
      ${f.quotes.map((q, j) => `<div class="quote ${q.verified ? '' : 'bad'}" data-quote="${i}.${j}">
          <textarea class="cell-input" rows="2" aria-label="Cita literal" data-draft="findings.${i}.quotes.${j}.quote">${esc(q.quote)}</textarea>
          <input class="cell-input" type="text" aria-label="Quién lo dice" placeholder="Quién lo dice" data-draft="findings.${i}.quotes.${j}.speaker" value="${esc(q.speaker)}">
          <button class="btn-link" type="button" data-act="remove-quote" data-i="${i}" data-j="${j}">Quitar cita</button>
          ${quoteStatus(q)}
        </div>`).join('')}
      ${!f.quotes.length ? `<p class="hint">${d.sourceType === 'notes' ? 'Sin citas: el documento son notas y no recoge frases literales.' : 'Sin citas literales para este hallazgo.'}</p>` : ''}
      <div class="row"><button class="btn-link" type="button" data-act="remove-finding" data-i="${i}">Quitar hallazgo</button></div>
    </div>`).join('');

// ---------------------------------------------------------------------------
// Quote verification
// ---------------------------------------------------------------------------

function normalize(s) {
  return String(s || '')
    .normalize('NFC')
    .replace(/[“”«»„‟"]/g, '"')
    .replace(/[‘’‚‛`´]/g, "'")
    .replace(/[–—]/g, '-')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}

function verifyQuote(quote, normalizedSource) {
  const q = normalize(quote).replace(/^["'\s]+|["'\s]+$/g, '').replace(/[.,;:]+$/, '').trim();
  if (q.length < 3) return false;
  // "..." or "…" inside a quote marks an omission: each part must appear, in order.
  const parts = q.split(/\s*(?:\.\.\.|…)\s*/).map((x) => x.trim()).filter(Boolean);
  let from = 0;
  for (const part of parts) {
    const at = normalizedSource.indexOf(part, from);
    if (at < 0) return false;
    from = at + part.length;
  }
  return parts.length > 0;
}

function verifyAll(minutes, source) {
  const ns = normalize(source);
  minutes.findings.forEach((f) => f.quotes.forEach((q) => { q.verified = verifyQuote(q.quote, ns); }));
}

function cleanVtt(text) {
  return text.split(/\r?\n/)
    .filter((line) => line.trim() && !/^WEBVTT/.test(line) && !/-->/.test(line) && !/^\d+$/.test(line.trim()) && !/^NOTE\b/.test(line))
    .map((line) => line.replace(/<v(?:\.[^ >]*)? ([^>]+)>/g, '$1: ').replace(/<[^>]+>/g, '').trim())
    .join('\n');
}

async function readFile(file) {
  const name = file.name.toLowerCase();
  if (/\.(mp3|m4a|wav|ogg|aac|flac|mp4|webm|mov)$/.test(name)) {
    throw new Error('Los archivos de audio o vídeo no se pueden procesar en esta versión. Sube la transcripción en .txt, .vtt o .docx.');
  }
  if (name.endsWith('.docx')) {
    if (!window.mammoth) await loadScript(LIBS.mammoth);
    const { value } = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return value;
  }
  if (name.endsWith('.txt') || name.endsWith('.vtt')) {
    const text = await file.text();
    return name.endsWith('.vtt') || text.startsWith('WEBVTT') ? cleanVtt(text) : text;
  }
  throw new Error('Formato no admitido. Usa un archivo .txt, .vtt o .docx.');
}

function cleanMinutes(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw { code: 'bad_shape' };
  const str = (v) => (typeof v === 'string' ? v.trim() : '');
  const arr = (v) => (Array.isArray(v) ? v : []);
  const out = {
    summary: str(raw.summary),
    findings: arr(raw.findings).slice(0, 7)
      .map((f) => ({ text: str(f?.text), quotes: arr(f?.quotes).map((q) => ({ quote: str(q?.quote), speaker: str(q?.speaker), verified: false })).filter((q) => q.quote) }))
      .filter((f) => f.text),
    decisions: arr(raw.decisions).map(str).filter(Boolean),
    openPoints: arr(raw.openPoints).map(str).filter(Boolean),
    todos: arr(raw.todos).map((t) => ({ task: str(t?.task), owner: str(t?.owner).replace(/^null$/i, ''), dueDate: /^\d{4}-\d{2}-\d{2}$/.test(str(t?.dueDate)) ? str(t.dueDate) : '' })).filter((t) => t.task),
  };
  if (!out.summary && !out.findings.length) throw { code: 'bad_shape' };
  return out;
}

function splitText(text) {
  if (text.length <= CHUNK_CHARS) return [text];
  const chunks = [];
  let current = '';
  for (const line of text.split('\n')) {
    if (current && current.length + line.length + 1 > CHUNK_CHARS) { chunks.push(current); current = ''; }
    current += (current ? '\n' : '') + line;
  }
  if (current) chunks.push(current);
  return chunks;
}

// Drafts minutes from a document: one call per chunk, a merge call when the
// document was split, then local quote verification.
async function buildMinutes({ text, ctx, onProgress = () => {} }) {
  const chunks = splitText(text);
  const partials = [];
  for (let i = 0; i < chunks.length; i++) {
    onProgress(chunks.length > 1 ? `Redactando el acta (parte ${i + 1} de ${chunks.length})…` : 'Redactando el acta…');
    const raw = await S.sample.json(minutesPrompt({ text: chunks[i], part: i + 1, parts: chunks.length, ctx }), {
      modelTier: 'default',
      onText: ({ text: written }) => onProgress(null, `Claude está escribiendo… (${written.length.toLocaleString('es-ES')} caracteres)`),
    });
    partials.push(cleanMinutes(raw));
  }
  let minutes = partials[0];
  if (partials.length > 1) {
    onProgress('Uniendo las partes del acta…');
    minutes = cleanMinutes(await S.sample.json(mergePrompt(partials, ctx), { modelTier: 'default' }));
  }
  onProgress('Comprobando las citas…');
  verifyAll(minutes, text);
  return { minutes, chunks: chunks.length };
}

function minutesContext(f) {
  const p = project(f.projectId);
  const people = (p.participants || []).filter((x) => f.participantIds.includes(x.id)).map(personLabel).join('; ');
  return { date: f.date, type: f.type, sourceType: f.sourceType, people };
}

function draftFromForm(f, result) {
  return { projectId: f.projectId, date: f.date, type: f.type, participantIds: [...f.participantIds], sourceType: f.sourceType, sourceFileName: f.fileName, sourceText: f.text, minutes: result.minutes, chunks: result.chunks, fromAgent: Boolean(f.fromAgent), cardId: f.cardId || '' };
}

async function generateMinutes() {
  const f = S.form;
  const onProgress = (text, detail) => {
    if (text) { S.busy = { text }; render(); }
    if (detail) { const el = app.querySelector('.progress .muted'); if (el) el.textContent = detail; }
  };
  try {
    const result = await buildMinutes({ text: f.text, ctx: minutesContext(f), onProgress });

  } catch (e) {
    console.error(e);
    S.busy = null;
    S.error = { message: aiMessage(e), retry: 'minutes' };
    render();
  }
}

async function downloadWord() {
  const m = meeting(S.view.id);
  const p = project(m.projectId);
  try {
    if (!window.docx) await loadScript(LIBS.docx);
  } catch {
    S.error = { message: 'No se ha podido cargar el generador de Word. Revisa tu conexión y vuelve a intentarlo.' };
    render();
    return;
  }
  const { Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType } = window.docx;
  const FONT = 'Century Gothic';
  const run = (text, o = {}) => new TextRun({ text, font: FONT, size: 21, color: '1B2242', ...o });
  const para = (children, o = {}) => new Paragraph({ children: Array.isArray(children) ? children : [run(children)], spacing: { after: 120 }, ...o });
  const heading = (text, level = HeadingLevel.HEADING_2) => new Paragraph({ heading: level, spacing: { before: 280, after: 120 }, children: [run(text, { bold: true, size: level === HeadingLevel.HEADING_1 ? 36 : 26, color: level === HeadingLevel.HEADING_1 ? '1B2242' : '1A2F51' })] });
  const bullets = (items) => (items?.length ? items.map((x) => para(x, { bullet: { level: 0 } })) : [para([run('Nada que destacar.', { italics: true })])]);
  const cell = (text, bold = false) => new TableCell({ children: [para([run(text, { bold })], { spacing: { after: 0 } })] });
  const people = (p.participants || []).filter((x) => (m.participantIds || []).includes(x.id)).map(personLabel).join(', ') || 'Sin indicar';
  const mi = m.minutes || {};
  const ts = S.todos.filter((t) => t.meetingId === m.id);

  const findings = [];
  (mi.findings || []).forEach((f, i) => {
    findings.push(para([run(`${i + 1}. ${f.text}`, { bold: true })]));
    (f.quotes || []).forEach((q) => findings.push(para([
      run(`«${q.quote}»`, { italics: true }),
      run(` — ${q.speaker || 'Sin atribuir'}`),
      ...(q.verified ? [] : [run('  (cita no verificada en el documento)', { color: 'B4401F' })]),
    ], { indent: { left: 360 } })));
  });

  const doc = new Document({
    creator: 'Asistente de Proyectos',
    title: `Acta ${p.code} ${fmtDate(m.date)}`,
    sections: [{
      children: [
        heading('Acta de reunión', HeadingLevel.HEADING_1),
        para([run('Proyecto: ', { bold: true }), run(`${p.code} · ${p.name} (${p.client})`)]),
        para([run('Fecha: ', { bold: true }), run(fmtDate(m.date))]),
        para([run('Tipo: ', { bold: true }), run(typeLabel(m.type))]),
        para([run('Participantes: ', { bold: true }), run(people)]),
        para([run('Documento fuente: ', { bold: true }), run(m.sourceFileName || (m.sourceType === 'notes' ? 'Notas' : 'Transcript'))]),
        heading('Resumen ejecutivo'),
        para(mi.summary || ''),
        heading('Findings principales'),
        ...(findings.length ? findings : [para('Sin hallazgos.')]),
        heading('Decisiones'),
        ...bullets(mi.decisions),
        heading('Puntos abiertos y riesgos'),
        ...bullets(mi.openPoints),
        heading("To-do's"),
        ts.length
          ? new Table({
              width: { size: 100, type: WidthType.PERCENTAGE },
              rows: [
                new TableRow({ tableHeader: true, children: ['#', 'Tarea', 'Responsable', 'Fecha límite'].map((h) => cell(h, true)) }),
                ...ts.map((t, i) => new TableRow({ children: [cell(String(i + 1)), cell(t.task), cell(t.owner || 'Por definir'), cell(t.dueDate ? fmtDate(t.dueDate) : 'Por definir')] })),
              ],
            })
          : para('Sin tareas.'),
      ],
    }],
  });
  const blob = await Packer.toBlob(doc);
  await saveFile(`${m.date}_${p.code}_Acta.docx`, blob);
}

function downloadCsv() {
  const f = S.form;
  const p = project(f.projectId);
  const cellCsv = (v) => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [['#', 'Tarea', 'Responsable', 'Fecha límite', 'Reunión', 'Tipo de reunión', 'Estado', 'Fecha de cierre']];
  todosOf(p.id).forEach((t, i) => {
    const m = meeting(t.meetingId);
    rows.push([i + 1, t.task, t.owner || 'Por definir', t.dueDate ? fmtDate(t.dueDate) : 'Por definir', m ? fmtDate(m.date) : '', m ? typeLabel(m.type) : '', t.status === 'done' ? 'Hecho' : isOverdue(t) ? 'Vencido' : 'Pendiente', t.doneAt ? fmtDate(t.doneAt) : '']);
  });
  // Semicolons and a UTF-8 BOM so Excel in Spanish opens columns and accents correctly.
  const csv = '﻿' + rows.map((r) => r.map(cellCsv).join(';')).join('\r\n');
  saveFile(`${p.code}_ToDos_${todayIso()}.csv`, csv);
}

async function write(fn, okText) {
  try {
    await fn();
    if (okText) toast(okText);
    return true;
  } catch (e) {
    console.error(e);
    S.error = { message: e?.code === 'quota_exceeded' ? 'Se ha llenado el espacio de la app. Elimina datos que ya no necesites.' : 'No se han podido guardar los cambios. Vuelve a intentarlo.' };
    render();
    return false;

}

function validateProject(f) {
  const e = {};
  const code = String(f.code || '').trim();
  if (!String(f.client || '').trim()) e.client = 'Escribe el cliente.';
  if (!code) e.code = 'Escribe el código del proyecto.';
  else if (S.projects.some((p) => p.code.toLowerCase() === code.toLowerCase())) e.code = 'Ya existe un proyecto con este código.';
  if (!String(f.name || '').trim()) e.name = 'Escribe el nombre del proyecto.';
  if (!f.startDate) e.startDate = 'Indica la fecha de inicio.';
  if (!f.endDate) e.endDate = 'Indica la fecha de fin.';
  else if (f.startDate && f.endDate < f.startDate) e.endDate = 'La fecha de fin no puede ser anterior a la de inicio.';
  if (f.budget === '' || f.budget === null || f.budget === undefined || Number(f.budget) < 0 || Number.isNaN(Number(f.budget))) e.budget = 'Indica el presupuesto en euros (0 o más).';
  return e;
}

function projectDoc(f) {
  return {
    code: f.code.trim(), client: f.client.trim(), name: f.name.trim(), startDate: f.startDate, endDate: f.endDate, budget: Number(f.budget),
    status: 'active', closedAt: null, createdAt: new Date().toISOString(),
    participants: f.people.filter((x) => String(x.name || '').trim()).map((x) => ({ id: newId(), name: String(x.name).trim(), role: String(x.role || '').trim(), type: x.type === 'internal' ? 'internal' : 'client' })),
  };
}

async function saveProject() {
  const f = S.form;
  f.errors = validateProject(f);
  if (Object.keys(f.errors).length) { render(); app.querySelector('[aria-invalid="true"]')?.focus(); return; }
  const id = newId();
  const data = projectDoc(f);
  if (await write(() => S.db.collection('projects').doc(id).set(data), 'Proyecto guardado')) {
    S.projects = [...S.projects.filter((p) => p.id !== id), { id, ...data }];
    go('project', { id });
  }
}

async function saveParticipant() {
  const f = S.form;
  const np = f.newPerson;
  if (!np.name.trim()) { f.errors.newPerson = 'Escribe el nombre.'; render(); return; }
  const p = project(f.projectId);
  const person = { id: newId(), name: np.name.trim(), role: np.role.trim(), type: np.type };
  const participants = [...(p.participants || []), person];
  if (await write(() => S.db.collection('projects').doc(p.id).update({ participants }), 'Participante añadido al proyecto')) {
    p.participants = participants;
    f.participantIds.push(person.id);
    f.adding = false;
    f.newPerson = { name: '', role: '', type: 'client' };
    delete f.errors.newPerson;
    render();
  }
}

async function saveMinutes(force) {
  const d = S.draft;
  const unverified = d.minutes.findings.some((f) => f.quotes.some((q) => !q.verified));
  if (unverified && !force) { S.view.confirmUnverified = true; render(); app.querySelector('.alert.warn')?.scrollIntoView({ block: 'center' }); return; }
  const m = d.minutes;
  const minutes = {
    summary: m.summary.trim(),
    findings: m.findings.filter((f) => f.text.trim()).map((f) => ({ text: f.text.trim(), quotes: f.quotes.filter((q) => q.quote.trim()).map((q) => ({ quote: q.quote.trim(), speaker: q.speaker.trim(), verified: q.verified })) })),
    decisions: m.decisions.map((x) => x.trim()).filter(Boolean),
    openPoints: m.openPoints.map((x) => x.trim()).filter(Boolean),
  };
  const ref = S.db.collection('meetings').doc();
  const meetingDoc = { projectId: d.projectId, date: d.date, type: d.type, participantIds: d.participantIds, sourceType: d.sourceType, sourceFileName: d.sourceFileName || '', sourceText: d.sourceText, minutes, createdAt: new Date().toISOString() };
  const ok = await write(async () => {
    await ref.set(meetingDoc);
    for (const t of m.todos.filter((x) => x.task.trim())) {
      await S.db.collection('todos').add({ projectId: d.projectId, meetingId: ref.id, task: t.task.trim(), owner: t.owner.trim(), dueDate: t.dueDate || '', status: 'pending', doneAt: '', createdAt: new Date().toISOString() });
    }
  }, 'Acta guardada');
  if (ok) {
    S.meetings = [...S.meetings.filter((x) => x.id !== ref.id), { id: ref.id, ...meetingDoc }];
    if (d.cardId) {
      const card = S.chat.find((x) => x.id === d.cardId);
      if (card) { card.state = 'saved'; card.meetingId = ref.id; }
      S.agentNotes.push(`El usuario ha revisado y guardado el acta de la reunión del ${fmtDate(d.date)} (${project(d.projectId)?.code}); su meetingId es ${ref.id}.`);
    }
    S.draft = null;
    go('minutes', { id: ref.id });
  }
}

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

function projectByCode(code) {
  const p = S.projects.find((x) => x.code.toLowerCase() === String(code || '').trim().toLowerCase());
  if (!p) throw new Error(`No existe ningún proyecto con el código «${code}». Los códigos válidos están en los datos.`);
  return p;
}

function addCard(card) {
  const item = { type: 'card', id: newId(), state: 'pending', ...card };
  S.chat.push(item);
  if (S.view.name === 'assistant') {
    app.querySelector('.chat-log')?.insertAdjacentHTML('beforeend', cardHtml(item));
    scrollChat();
  }
  return item;
}

function refreshCard(card) {
  const el = app.querySelector(`[data-card-id="${card.id}"]`);
  if (el) el.outerHTML = cardHtml(card);
}

async function runMinutesCard(card) {
  card.state = 'working';
  card.progress = 'Redactando el acta…';
  refreshCard(card);
  try {
    const result = await buildMinutes({ text: card.form.text, ctx: minutesContext(card.form), onProgress: (text) => { if (text) { card.progress = text; refreshCard(card); } } });
    card.form.cardId = card.id;
    card.draft = draftFromForm(card.form, result);
    card.state = 'ready';
    const m = result.minutes;
    const unverified = m.findings.reduce((n, f) => n + f.quotes.filter((q) => !q.verified).length, 0);
    const noOwner = m.todos.filter((t) => !t.owner).length;
    card.stats = { findings: m.findings.length, unverified, todos: m.todos.length, noOwner };
    S.agentNotes.push(`El borrador del acta del ${fmtDate(card.form.date)} (${project(card.form.projectId)?.code}) está listo para que el usuario lo revise: ${m.findings.length} hallazgos, ${unverified} citas sin verificar, ${m.todos.length} to-do's${noOwner ? `, ${noOwner} sin responsable` : ''}. Aún no está guardado.`);
  } catch (e) {
    console.error(e);
    card.state = 'error';
    card.error = aiMessage(e);
  }
  refreshCard(card);
}

async function runEmailCard(card) {
  card.state = 'working';
  refreshCard(card);
  const m = meeting(card.meetingId);
  const p = project(m.projectId);
  try {
    const { text } = await S.sample(emailPrompt(m, p, card.opts), { modelTier: 'default', cache: false });
    card.subject = `${p.name} - ${card.opts.lang === 'en' ? 'Meeting summary' : 'Resumen reunión'} ${fmtDate(m.date)}`;
    card.body = text.trim();
    card.state = 'ready';
  } catch (e) {
    console.error(e);
    card.state = 'error';
    card.error = aiMessage(e);
  }
  refreshCard(card);
}

function agentTools() {
  return [
    {
      name: 'prepare_minutes',
      description: 'Starts drafting the minutes of a meeting from a document attached in the chat. Runs in the background (1-2 minutes) and shows a card where the user reviews and saves them; returns at once. Call it only when project, date, meeting type and document type are known.',
      inputSchema: {
        type: 'object',
        properties: {
          projectCode: { type: 'string' },
          documentId: { type: 'string' },
          date: { type: 'string', description: 'Meeting date, YYYY-MM-DD' },
          meetingType: { type: 'string', enum: ['internal', 'external'] },
          sourceType: { type: 'string', enum: ['transcript', 'notes'] },
          participantNames: { type: 'array', items: { type: 'string' }, description: 'People who attended' },
        },
        required: ['projectCode', 'documentId', 'date', 'meetingType', 'sourceType'],
      },
      execute(input) {
        const p = projectByCode(input.projectCode);
        const doc = S.docs.find((d) => d.id === String(input.documentId));
        if (!doc) throw new Error('No hay ningún documento con ese identificador. Pide al usuario que lo adjunte.');
        if (!DATE_RE.test(String(input.date))) throw new Error('La fecha debe tener el formato AAAA-MM-DD.');
        const people = p.participants || [];
        const ids = [];
        const unknown = [];
        (Array.isArray(input.participantNames) ? input.participantNames : []).map((n) => String(n).trim()).filter(Boolean).forEach((name) => {
          const low = name.toLowerCase();
          const hit = people.find((x) => x.name.toLowerCase() === low) || people.find((x) => x.name.toLowerCase().includes(low) || low.includes(x.name.toLowerCase()));
          if (hit) { if (!ids.includes(hit.id)) ids.push(hit.id); } else unknown.push(name);
        });
        const form = {
          projectId: p.id, client: p.client, date: String(input.date), type: input.meetingType === 'internal' ? 'internal' : 'external', participantIds: ids,
          sourceType: input.sourceType === 'notes' ? 'notes' : 'transcript', fileName: doc.name, text: doc.text,
          adding: false, newPerson: { name: '', role: '', type: 'client' }, errors: {}, fromAgent: true,
        };
        const card = addCard({ kind: 'minutes', form, state: 'working', progress: 'Redactando el acta…' });
        runMinutesCard(card);
        return { status: 'started', project: p.code, attendeesMatched: ids.length, attendeesNotInProject: unknown };
      },
    },
    {
      name: 'propose_project',
      description: 'Proposes creating a new project. Shows a card the user must confirm; nothing is saved until then. Throws with the reason if a field is missing or invalid (for example, a duplicate code): ask the user for it.',
      inputSchema: {
        type: 'object',
        properties: {
          client: { type: 'string' }, code: { type: 'string' }, name: { type: 'string' },
          startDate: { type: 'string', description: 'YYYY-MM-DD' }, endDate: { type: 'string', description: 'YYYY-MM-DD' },
          budgetEUR: { type: 'number' },
          participants: { type: 'array', items: { type: 'object', properties: { name: { type: 'string' }, role: { type: 'string' }, type: { type: 'string', enum: ['client', 'internal'] } }, required: ['name', 'type'] } },
        },
        required: ['client', 'code', 'name', 'startDate', 'endDate', 'budgetEUR'],
      },
      execute(input) {
        const fields = {
          client: String(input.client || ''), code: String(input.code || ''), name: String(input.name || ''),
          startDate: DATE_RE.test(String(input.startDate)) ? String(input.startDate) : '', endDate: DATE_RE.test(String(input.endDate)) ? String(input.endDate) : '',
          budget: input.budgetEUR, people: Array.isArray(input.participants) ? input.participants.map((x) => ({ name: String(x?.name || ''), role: String(x?.role || ''), type: x?.type === 'internal' ? 'internal' : 'client' })) : [],
        };
        const errors = Object.values(validateProject(fields));
        if (errors.length) throw new Error(errors.join(' '));
        addCard({ kind: 'project', fields });
        return { status: 'waiting_for_user_confirmation' };
      },
    },
    {
      name: 'propose_participant',
      description: 'Proposes adding a person to a project team. Shows a card the user must confirm.',
      inputSchema: { type: 'object', properties: { projectCode: { type: 'string' }, name: { type: 'string' }, role: { type: 'string' }, type: { type: 'string', enum: ['client', 'internal'] } }, required: ['projectCode', 'name', 'type'] },
      execute(input) {
        const p = projectByCode(input.projectCode);
        const name = String(input.name || '').trim();
        if (!name) throw new Error('Falta el nombre de la persona.');
        if ((p.participants || []).some((x) => x.name.toLowerCase() === name.toLowerCase())) throw new Error(`${name} ya está en el proyecto.`);
        addCard({ kind: 'participant', projectId: p.id, person: { name, role: String(input.role || '').trim(), type: input.type === 'internal' ? 'internal' : 'client' } });
        return { status: 'waiting_for_user_confirmation' };
      },
    },
    {
      name: 'propose_todo_update',
      description: 'Proposes changing a to-do (status, owner or due date) or deleting it. Shows a card the user must confirm. Use an empty string to clear owner or due date.',
      inputSchema: {
        type: 'object',
        properties: {
          todoId: { type: 'string' }, status: { type: 'string', enum: ['pending', 'done'] }, owner: { type: 'string' },
          dueDate: { type: 'string', description: 'YYYY-MM-DD, or empty to clear' }, remove: { type: 'boolean', description: 'true to delete the to-do' },
        },
        required: ['todoId'],
      },
      execute(input) {
        const t = S.todos.find((x) => x.id === String(input.todoId));
        if (!t) throw new Error('No existe ningún to-do con ese identificador.');
        const changes = {};
        if (input.status === 'done' || input.status === 'pending') changes.status = input.status;
        if (typeof input.owner === 'string') changes.owner = input.owner.trim();
        if (typeof input.dueDate === 'string') {
          if (input.dueDate && !DATE_RE.test(input.dueDate)) throw new Error('La fecha debe tener el formato AAAA-MM-DD.');
          changes.dueDate = input.dueDate;
        }
        if (!input.remove && !Object.keys(changes).length) throw new Error('No has indicado ningún cambio.');
        addCard({ kind: 'todo', todoId: t.id, changes, remove: Boolean(input.remove) });
        return { status: 'waiting_for_user_confirmation' };
      },
    },
    {
      name: 'draft_client_email',
      description: 'Drafts the follow-up email to the client for a saved external meeting. Runs in the background and shows the draft in a card the user can copy; returns at once.',
      inputSchema: { type: 'object', properties: { meetingId: { type: 'string' }, sender: { type: 'string', description: 'Name of the internal person who signs' }, language: { type: 'string', enum: ['es', 'en'] } }, required: ['meetingId', 'sender'] },
      execute(input) {
        const m = meeting(String(input.meetingId));
        if (!m) throw new Error('No existe esa reunión guardada. Si el acta aún no está guardada, el usuario debe guardarla primero.');
        if (m.type !== 'external') throw new Error('Solo se redacta email al cliente para reuniones externas.');
        const sender = String(input.sender || '').trim();
        if (!sender) throw new Error('Falta quién firma el email.');
        const card = addCard({ kind: 'email', meetingId: m.id, state: 'working', opts: { sender, lang: input.language === 'en' ? 'en' : 'es' } });
        runEmailCard(card);
        return { status: 'started' };
      },
    },
    {
      name: 'read_minutes',
      description: 'Returns the full saved minutes of one meeting, including findings with their verbatim quotes.',
      inputSchema: { type: 'object', properties: { meetingId: { type: 'string' } }, required: ['meetingId'] },
      execute(input) {
        const m = meeting(String(input.meetingId));
        if (!m) throw new Error('No existe esa reunión.');
        const mi = m.minutes || {};
        return { date: m.date, type: typeLabel(m.type), summary: mi.summary, findings: mi.findings, decisions: mi.decisions, openPoints: mi.openPoints };
      },
    },
  ];
}

function addDoc(name, text) {
  const doc = { id: `D${S.docs.length + 1}`, name, text, words: wordCount(text) };
  S.docs.push(doc);
  return doc;
}

async function sendToAgent(raw) {
  if (S.agentRun) return;
  let text = String(raw || '').trim();
  // Long pasted text becomes an attached document instead of a chat message.
  if (text.length > 2500) {
    S.pendingDocs.push(addDoc('Texto pegado', text));
    text = '';
  }
  const docs = S.pendingDocs.splice(0);
  if (!text && !docs.length) return;
  if (!text) text = 'Prepara el acta de este documento.';
  S.chatInput = '';
  S.chat.push({ role: 'user', text, docs: docs.map((d) => `${d.name} · ${d.words.toLocaleString('es-ES')} palabras`) });
  const notes = S.agentNotes.splice(0);
  const content = [
    notes.length ? `Novedades desde mi último mensaje: ${notes.join(' ')}` : '',
    text,
    docs.length ? `Documentos adjuntos: ${docs.map((d) => `${d.id} «${d.name}» (${d.words} palabras)`).join('; ')}.` : '',
  ].filter(Boolean).join('\n\n');
  S.history.push({ role: 'user', content });
  const bubble = { role: 'assistant', text: '', streaming: true };
  S.chat.push(bubble);
  const ctl = new AbortController();
  S.agentRun = ctl;
  render();
  scrollChat();
  try {
    const { text: answer } = await S.sample([{ role: 'user', content: agentInstructions() }, ...S.history.slice(-20)], {
      tools: agentTools(),
      signal: ctl.signal,
      modelTier: 'default',
      onText: ({ text: soFar }) => { bubble.text = soFar; updateBubble(bubble); },
    });
    bubble.text = answer;
  } catch (e) {
    console.error(e);
    bubble.text = e?.text || '';
    if (e?.code !== 'cancelled') bubble.error = aiMessage(e);
  }
  bubble.streaming = false;
  if (bubble.text) S.history.push({ role: 'assistant', content: bubble.text });
  S.agentRun = null;
  if (S.view.name === 'assistant') { render(); scrollChat(); }
}

function updateBubble(bubble) {
  const el = app.querySelector(`[data-msg="${S.chat.indexOf(bubble)}"] .bubble`);
  if (el) { el.textContent = plain(bubble.text); el.classList.remove('thinking'); }
}

function scrollChat() {
  if (S.view.name !== 'assistant') return;
  app.querySelector('.composer')?.scrollIntoView({ block: 'end' });
}

const plain = (t) => String(t || '').replace(/\*\*(.+?)\*\*/g, '$1');

function cardHtml(c) {
  const wrap = (eyebrow, inner) => `<section class="agent-card" data-card-id="${esc(c.id)}"><span class="eyebrow">${eyebrow}</span>${inner}</section>`;
  const decision = c.state === 'pending'
    ? `<div class="row"><button class="btn btn-small btn-primary" type="button" data-act="card-confirm" data-card="${esc(c.id)}">Confirmar</button><button class="btn-link" type="button" data-act="card-discard" data-card="${esc(c.id)}">Descartar</button></div>`
    : c.state === 'confirmed' ? '<span class="chip chip-ok">Confirmado y guardado</span>'
    : c.state === 'discarded' ? '<span class="chip chip-plain">Descartado</span>'
    : c.state === 'error' ? `<p class="err">${WARN}${esc(c.error)}</p>` : '';
  const working = (text) => `<div class="inline-dots"><div class="dots"><i></i><i></i><i></i></div><span>${esc(text)}</span></div>`;

  if (c.kind === 'minutes') {
    const p = project(c.form.projectId);
    const head = `<h3>${esc(p?.code || '')} · Reunión ${typeLabel(c.form.type).toLowerCase()} del ${fmtDate(c.form.date)}</h3><p class="hint">${esc(c.form.fileName)}</p>`;
    if (c.state === 'working') return wrap('Preparando el acta', head + working(c.progress || 'Redactando el acta…'));
    if (c.state === 'error') return wrap('Acta', `${head}<p class="err">${WARN}${esc(c.error)}</p><div><button class="btn btn-small" type="button" data-act="card-retry" data-card="${esc(c.id)}">Reintentar</button></div>`);
    if (c.state === 'saved') return wrap('Acta guardada', `${head}<div><button class="btn btn-small" type="button" data-go="minutes" data-id="${esc(c.meetingId)}">Ver acta</button></div>`);
    const s = c.stats;
    return wrap('Borrador del acta listo', `${head}
      <div class="chips"><span class="chip">${s.findings} hallazgos</span>${s.unverified ? `<span class="chip chip-alert">${WARN} ${s.unverified} ${s.unverified === 1 ? 'cita sin verificar' : 'citas sin verificar'}</span>` : '<span class="chip chip-ok">Citas verificadas</span>'}<span class="chip">${s.todos} to-do's</span>${s.noOwner ? `<span class="chip chip-plain">${s.noOwner} sin responsable</span>` : ''}</div>
      <p>${esc(c.draft.minutes.summary)}</p>
      <div><button class="btn btn-small btn-primary" type="button" data-act="card-review" data-card="${esc(c.id)}">Revisar y guardar</button></div>`);
  }
  if (c.kind === 'email') {
    const m = meeting(c.meetingId);
    const head = `<h3>Email al cliente · reunión del ${fmtDate(m?.date)}</h3>`;
    if (c.state === 'working') return wrap('Redactando el email', head + working('Claude está redactando el email…'));
    if (c.state === 'error') return wrap('Email', `${head}<p class="err">${WARN}${esc(c.error)}</p><div><button class="btn btn-small" type="button" data-act="card-retry" data-card="${esc(c.id)}">Reintentar</button></div>`);
    return wrap('Borrador del email', `${head}<p class="hint">Asunto: ${esc(c.subject)} · <span class="num">${wordCount(c.body)}</span> palabras</p><pre>${esc(c.body)}</pre>
      <div class="row"><button class="btn btn-small btn-primary" type="button" data-act="card-copy" data-card="${esc(c.id)}">Copiar</button><button class="btn btn-small" type="button" data-act="card-edit-email" data-card="${esc(c.id)}">Abrir en el editor</button></div>`);
  }
  if (c.kind === 'project') {
    const f = c.fields;
    const team = (type) => f.people.filter((x) => x.type === type).map((x) => `${x.name}${x.role ? ` (${x.role})` : ''}`).join(', ') || '—';
    return wrap('Propuesta · nuevo proyecto', `<h3>${esc(f.code)} · ${esc(f.name)}</h3>
      <dl class="facts"><div><dt>Cliente</dt><dd>${esc(f.client)}</dd></div><div><dt>Fechas</dt><dd class="num">${fmtDate(f.startDate)} – ${fmtDate(f.endDate)}</dd></div><div><dt>Presupuesto</dt><dd class="num">${fmtEur(f.budget)}</dd></div></dl>
      <p class="hint">Equipo del cliente: ${esc(team('client'))}<br>Equipo interno: ${esc(team('internal'))}</p>${decision}`);
  }
  if (c.kind === 'participant') {
    const p = project(c.projectId);
    return wrap('Propuesta · añadir participante', `<h3>${esc(personLabel(c.person))}</h3><p class="hint">Proyecto ${esc(p?.code)} · ${esc(p?.name)}</p>${decision}`);
  }
  if (c.kind === 'todo') {
    const t = S.todos.find((x) => x.id === c.todoId) || c.snapshot || {};
    const lines = c.remove ? ['Eliminar este to-do'] : [
      c.changes.status ? `Estado: ${c.changes.status === 'done' ? 'hecho' : 'pendiente'}` : '',
      'owner' in c.changes ? `Responsable: ${c.changes.owner || 'por definir'}` : '',
      'dueDate' in c.changes ? `Fecha límite: ${c.changes.dueDate ? fmtDate(c.changes.dueDate) : 'por definir'}` : '',
    ].filter(Boolean);
    return wrap(c.remove ? 'Propuesta · eliminar to-do' : 'Propuesta · cambiar to-do', `<h3>${esc(t.task || 'To-do')}</h3><ul class="read-list">${lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>${decision}`);
  }
  return '';
}

async function confirmCard(c) {
  let ok = false;
  if (c.kind === 'project') {
    const errors = Object.values(validateProject(c.fields));
    if (errors.length) { c.state = 'error'; c.error = errors.join(' '); refreshCard(c); return; }
    const id = newId();
    const data = projectDoc(c.fields);
    ok = await write(() => S.db.collection('projects').doc(id).set(data), 'Proyecto creado');
    if (ok) { S.projects = [...S.projects, { id, ...data }]; S.agentNotes.push(`El usuario confirmó la creación del proyecto ${data.code}.`); }
  }
  if (c.kind === 'participant') {
    const p = project(c.projectId);
    const participants = [...(p.participants || []), { id: newId(), ...c.person }];
    ok = await write(() => S.db.collection('projects').doc(p.id).update({ participants }), 'Participante añadido');
    if (ok) { p.participants = participants; S.agentNotes.push(`El usuario confirmó añadir a ${c.person.name} al proyecto ${p.code}.`); }
  }
  if (c.kind === 'todo') {
    const t = S.todos.find((x) => x.id === c.todoId);
    if (!t) { c.state = 'error'; c.error = 'Este to-do ya no existe.'; refreshCard(c); return; }
    c.snapshot = { task: t.task };
    if (c.remove) {
      ok = await write(() => S.db.collection('todos').doc(t.id).delete(), 'To-do eliminado');
    } else {
      const changes = { ...c.changes };
      if (changes.status) changes.doneAt = changes.status === 'done' ? todayIso() : '';
      ok = await write(() => S.db.collection('todos').doc(t.id).update(changes), 'To-do actualizado');
    }
    if (ok) S.agentNotes.push(`El usuario confirmó ${c.remove ? 'eliminar' : 'cambiar'} el to-do «${t.task}».`);
  }
  if (ok) { c.state = 'confirmed'; S.error = null; }
  if (S.view.name === 'assistant') render();
}

  const unavailable = !S.sample

  const items = S.chat.map((item, i) => {

    if (item.role === 'user') {
      return `<div class="msg msg-user" data-msg="${i}">${item.text ? `<p class="bubble">${esc(item.text)}</p>` : ''}${item.docs?.length ? `<div class="chips">${item.docs.map((d) => `<span class="chip chip-plain">Adjunto: ${esc(d)}</span>`).join('')}</div>` : ''}</div>`;
    }
    const thinking = item.streaming && !item.text;
    return `<div class="msg msg-ai" data-msg="${i}">${item.text || item.streaming ? `<p class="bubble ${thinking ? 'thinking' : ''}">${thinking ? 'Pensando…' : esc(plain(item.text))}</p>` : ''}${item.error ? `<div class="alert warn" role="alert">${WARN}<div><p>${esc(item.error)}</p></div></div>` : ''}</div>`;

    </div>`;
  return `${pageHead('Asistente', 'Pídele lo que necesites con tus palabras. Antes de guardar o cambiar nada, te pedirá confirmación.')}

    <section class="chat" aria-label="Conversación con el asistente">
      <div class="chat-log" aria-live="polite">${items || suggestions}</div>
      ${errorBox()}
      <div class="composer">
        ${S.pendingDocs.length ? `<div class="chips">${S.pendingDocs.map((d, i) => `<span class="chip chip-plain">Adjunto: ${esc(d.name)} · ${d.words.toLocaleString('es-ES')} palabras <button class="btn-link" type="button" data-act="chat-remove-doc" data-i="${i}" aria-label="Quitar ${esc(d.name)}">Quitar</button></span>`).join('')}</div>` : ''}
        <label class="visually-hidden" for="chat-input">Mensaje para el asistente</label>
        <textarea id="chat-input" rows="3" placeholder="Escribe tu mensaje. Puedes pegar aquí un transcript completo." ${unavailable ? 'disabled' : ''}>${esc(S.chatInput)}</textarea>
        <div class="row">
          <div class="row">
            <span class="btn btn-small file-btn">Adjuntar archivo<input type="file" id="chat-file" data-act="chat-file" accept=".txt,.vtt,.docx" aria-label="Adjuntar archivo .txt, .vtt o .docx" ${unavailable ? 'disabled' : ''}></span>
            <button class="btn btn-small" type="button" data-act="chat-sample" ${unavailable ? 'disabled' : ''}>Adjuntar transcript de ejemplo</button>
          </div>

    </section>`;
}
